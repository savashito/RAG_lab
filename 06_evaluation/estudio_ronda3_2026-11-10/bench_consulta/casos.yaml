# Benchmark de la consulta (ronda 3): casos inventados, sin datos de participantes.
#
# Cada caso:
#   relato      primer mensaje de la persona
#   respuestas  lo que contesta cuando el asistente pide ese dato (id de la pestaña Datos del expediente; «relato»
#               si le pide que cuente su situación). Una lista = una respuesta por cada vez que se lo pregunta.
#               Lo que no está aquí lo contesta con «no sé».
#   esperado
#     tipos           tipos de caso que deben quedar en el expediente (puede haber más)
#     datos           valores que deben quedar en el expediente
#     reglas          reglas que deben aplicar
#     reglas_no       reglas que no deben aplicar
#     max_preguntas   cuántas preguntas a lo más antes de orientar
#     hechos          lo que contó y no cabe en ningún dato, que debe seguir en la lista de hechos del expediente al final;
#                     cada uno es una o más palabras separadas por «|» (sin acentos ni mayúsculas): basta una
casos:
- id: fotos_extorsion_adulta
  relato: Mandé unas fotos íntimas a alguien que conocí en una app y ahora me pide dinero para no publicarlas
  respuestas: {lugar_hechos: En la CDMX, papel: a mí, edad_victima: tengo 24}
  esperado:
    tipos: [imagenes_intimas]
    datos: {lugar_hechos: Ciudad de México, papel: victima, pide_dinero: si, contenido_intimo: si, edad_victima: 24}
    reglas: [r021, r020]
    reglas_no: [r022, r023, r024]
    max_preguntas: 3

