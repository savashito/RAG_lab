version: borrador-2026-11-10
nota: 'Borrador generado por Claude a partir del corpus. estado: borrador/sugerida = sin revisar por Karen; confirmada = revisada.
  Los artículos de cdmx los sugirió un script desde el índice de capítulos del corpus. generales: datos que se piden en todo
  caso. cuando: condiciones que evalúa Python (todas deben cumplirse; vacía = aplica siempre en su tipo de caso); condicion:
  explicación en palabras para Karen.'
generales:
- lugar_hechos
- papel
datos:
- id: lugar_hechos
  tipo: estado
  obligatorio: true
  pregunta: ¿En qué estado pasó?
  para_que: Qué código penal aplica (solo en delitos del fuero común; ver federal)
  estado: borrador
- id: papel
  tipo: opcion
  opciones:
  - victima
  - persona_senalada
  - familiar_o_tercero
  pregunta: ¿Te pasó a ti, te acusan a ti, o le pasó a otra persona?
  para_que: Derechos de víctima o de imputado
  estado: borrador
- id: edad_victima
  tipo: numero
  pregunta: ¿Qué edad tiene la víctima?
  para_que: Menor de edad o adulta; los umbrales (por ejemplo, 12 años en la CDMX) cambian por estado
  estado: borrador
- id: victima_mujer
  tipo: si_no
  pregunta: ¿La víctima es mujer (incluida mujer trans)?
  para_que: Feminicidio y transfeminicidio; Ley General de Acceso de las Mujeres. No cambia los delitos que protegen a cualquier
    persona (violencia familiar, acoso, Ley Olimpia), ni las medidas de protección del CNPP, que son para cualquier víctima
  estado: borrador
- id: relacion_partes
  tipo: opcion
  opciones:
  - pareja_o_expareja
  - familiar
  - trabajo
  - escuela
  - ninguna
  pregunta: ¿Qué relación tienen? (pareja o expareja, familiar, trabajo, escuela, ninguna)
  para_que: Violencia familiar, hostigamiento, agravantes
  estado: borrador
- id: superior_o_docente
  tipo: si_no
  pregunta: ¿Esa persona es tu jefe, maestro o supervisa tu trabajo?
  para_que: Hostigamiento sexual frente a acoso sexual
  estado: borrador
- id: servidor_publico
  tipo: si_no
  pregunta: ¿Quien lo hizo es policía o trabaja en el gobierno?
  para_que: Abuso de autoridad, tortura, cohecho
  estado: borrador
- id: pide_dinero
  tipo: si_no
  pregunta: ¿Te pidieron dinero o algo a cambio?
  para_que: Extorsión frente a amenazas o difusión
  estado: borrador
- id: ya_difundido
  tipo: si_no
  pregunta: ¿Ya publicaron o mandaron las imágenes a alguien?
  para_que: Intimidad sexual consumada o amenaza
  estado: borrador
- id: violencia_o_arma
  tipo: si_no
  pregunta: ¿Hubo golpes, amenazas con arma o fuerza?
  para_que: Robo con violencia, agravantes
  estado: borrador
- id: medio_digital
  tipo: si_no
  pregunta: ¿Pasó por internet, redes o teléfono?
  para_que: Violencia digital; delitos a distancia
  estado: borrador
- id: intencional
  tipo: si_no
  pregunta: ¿Fue a propósito o fue un accidente?
  para_que: Doloso frente a culposo (tránsito, médico)
  estado: borrador
- id: gravedad_lesion
  tipo: opcion
  opciones:
  - menos_15_dias
  - 15_a_60_dias
  - mas_60_dias
  - riesgo_vida
  pregunta: ¿Cuánto tarda en sanar la lesión? ¿Puso en riesgo la vida?
  para_que: Grado de lesiones; los plazos (15 y 60 días en la CDMX) cambian por estado
  estado: borrador
- id: monto
  tipo: numero
  pregunta: ¿Cuánto dinero o de qué valor?
  para_que: Pena del robo y del fraude
  estado: borrador
- id: consentimiento
  tipo: si_no
  pregunta: ¿La persona estuvo de acuerdo? (tomar las imágenes, el procedimiento médico)
  para_que: Intimidad sexual (en algunos estados), responsabilidad médica
  estado: borrador
- id: federal
  tipo: si_no
  preguntar: false
  pregunta: (no se pregunta; lo decide el tipo de caso o el delito)
  para_que: 'Drogas, armas de fuego, delincuencia organizada y otros delitos federales: aplica el Código Penal Federal o la
    ley federal sin importar el estado'
  estado: borrador
