consentimiento: '### 1. Invitación a participar


  Se le invita a participar en un estudio de investigación que evalúa un asistente de inteligencia artificial diseñado para
  responder preguntas sobre el derecho penal mexicano.


  Antes de decidir si desea participar, lea cuidadosamente la siguiente información. Puede hacer preguntas al equipo de investigación
  si necesita aclaraciones.


  ### 2. Propósito del estudio


  El propósito de esta investigación es evaluar la precisión jurídica, la identificación de la jurisdicción aplicable y la
  utilidad de un asistente de inteligencia artificial que proporciona información sobre cuestiones relacionadas con el derecho
  penal mexicano.


  El estudio busca comprender cómo las personas interactúan con este tipo de sistemas, cómo interpretan sus respuestas y qué
  tan capaces son de identificar posibles errores o problemas en la información proporcionada.


  **El asistente no sustituye a un abogado ni proporciona asesoramiento jurídico profesional.**


  ### 3. Requisitos para participar


  Para participar, debe:


  - Tener al menos 18 años.

  - Leer y comprender la información de este consentimiento.

  - Aceptar voluntariamente participar en el estudio.


  Todos los participantes de este estudio serán mayores de edad.


  ### 4. ¿Qué ocurrirá si decide participar?


  Su participación durará aproximadamente 10–30 minutos.


  Durante el estudio, se le pedirá que:


  1. Responda algunas preguntas generales sobre su perfil.

  2. Interactúe con el asistente de inteligencia artificial para explorar su funcionamiento.

  3. Consulte al asistente sobre tres escenarios hipotéticos relacionados con el derecho penal mexicano.

  4. Responda preguntas sobre la información recibida, su confianza en las respuestas y su percepción de posibles errores.

  5. Complete preguntas finales sobre la experiencia de uso y la utilidad del sistema.


  Los escenarios son ficticios y están diseñados con fines de investigación. No necesita compartir experiencias personales
  ni revelar información sobre situaciones jurídicas propias.


  Es posible que se le asigne una versión específica del asistente como parte de la evaluación.


  ### 5. Riesgos e incomodidades


  Los riesgos previsibles de participar son limitados, pero pueden incluir:


  - **Incomodidad emocional:** algunos escenarios hipotéticos pueden abordar situaciones relacionadas con acoso, amenazas
  o divulgación de imágenes íntimas.

  - **Información incorrecta o confusa:** el asistente puede proporcionar respuestas incompletas, imprecisas o jurídicamente
  incorrectas. No debe utilizar sus respuestas para tomar decisiones jurídicas reales.

  - **Riesgos de confidencialidad:** para mitigar riesgos de confidencialidad, no pedimos datos personales. Solo almacenamos
  datos estadísticos como carrera y edad, todo se hace de forma anónima para el estudio.


  Puede dejar de participar si se siente incómodo. No tiene que responder preguntas con las que no se sienta a gusto.


  ### 6. Beneficios


  Los resultados podrían contribuir al desarrollo y evaluación de sistemas de inteligencia artificial más precisos, transparentes
  y responsables para responder preguntas sobre cuestiones jurídicas.
  Se publicarán en la conferencia de 
  https://facctconference.org/2027/cfp.html


  ### 7. Compensación


  No recibirá compensación económica ni otro pago por participar en este estudio.


  ### 8. ¿Qué información se recopilará?


  Durante el estudio podrán recopilarse los siguientes datos:


  - Respuestas al cuestionario inicial: máximo nivel de estudios, área de estudios, carrera (opcional), formación en derecho,
  frecuencia de uso de asistentes de IA, qué tan capaz se siente de buscar y entender información legal por su cuenta, y rango
  de edad.

  - Interacciones y mensajes intercambiados con el asistente.

  - Respuestas a preguntas de comprensión y evaluación.

  - Calificaciones de confianza y percepciones sobre posibles errores.

  - Respuestas sobre la experiencia de uso.

  - Comentarios escritos que decida proporcionar.

  - Registro de su consentimiento electrónico.


  No se pide su nombre ni su correo electrónico, y la base de datos del estudio no guarda su dirección IP ni otros metadatos
  técnicos para identificarle.


  **Registros técnicos del servidor.** Como ocurre con cualquier página de internet, el servidor web que aloja el estudio
  registra de forma automática, en sus bitácoras técnicas, la dirección IP desde la que se conecta cada visitante y la página
  que solicita. Es el funcionamiento normal de todos los servidores web y sirve para su seguridad y operación (por ejemplo,
  para detectar ataques o errores). Estos registros están separados de las respuestas del estudio, no se analizan como parte
  de la investigación ni se usan para identificarle.


  ### 9. Almacenamiento y confidencialidad de los datos


  Los datos del estudio se almacenarán en una base de datos alojada en un servidor contratado a Hostinger. El consentimiento
  electrónico también se conservará en la base de datos del estudio.


  El equipo de investigación utilizará códigos de participante para organizar los datos y procurará evitar la inclusión de
  información que permita identificar directamente a los participantes en los análisis y resultados.


  Los datos se utilizarán con fines de investigación académica y podrán presentarse en publicaciones o presentaciones científicas.
  Los resultados se comunicarán de manera que se reduzca el riesgo de identificar a participantes individuales.


  Aunque el equipo tomará medidas para proteger la confidencialidad, no puede garantizarse que el riesgo de acceso no autorizado
  sea absolutamente nulo.


  ### 10. Participación voluntaria y retirada


  Su participación es completamente voluntaria.


  Puede negarse a participar o interrumpir su participación en cualquier momento, sin penalización ni pérdida de beneficios
  a los que tenga derecho.


  Mientras participa, puede retirarse en cualquier momento con el botón **«Retirarme del estudio»**, en la parte superior
  de la página: se borrará de inmediato todo lo que haya escrito.


  Al terminar, la página le mostrará su **código anónimo de participante** (por ejemplo, ABCD-EF23). Anótelo. Si más adelante
  desea que se eliminen sus datos, envíe ese código por correo electrónico a cualquiera de los investigadores de la sección
  de contacto. Como no guardamos su nombre ni su correo, **sin ese código no hay forma de saber cuáles son sus respuestas**
  y no podríamos eliminarlas.


  ### 11. Contacto del equipo de investigación


  Si tiene preguntas sobre el estudio, puede contactar con:


  **Investigador asociado:** Rodrigo Savage Chávez\

  Correo electrónico: ro.savage@northeastern.edu\

  Teléfono: +52 (55) 85 61 08 89 



  **Investigadora y experta en derecho:** Karen Alarcón 


  **Investigador principal (PI):** Francisco Javier Marmolejo Cossío \

  Correo electrónico del PI: marmolf@bc.edu 


  Si tiene preguntas sobre sus derechos como participante o desea plantear una preocupación de forma independiente del equipo
  investigador, puede contactar con la oficina que protege a los participantes en investigaciones de Boston College:



  ### 12. Declaración de consentimiento electrónico


  Al continuar, usted declara que:


  - He leído y comprendido la información anterior.

  - Tengo al menos 18 años.

  - He tenido la oportunidad de considerar si deseo participar.

  - Comprendo que mi participación es voluntaria y que puedo retirarme.

  - Comprendo que el asistente de inteligencia artificial puede cometer errores y que sus respuestas no constituyen asesoramiento
  jurídico profesional.

  - Acepto que la información descrita en este documento se recopile y utilice para los fines de investigación explicados.


  Al seleccionar «Acepto participar», su decisión de consentimiento electrónico quedará registrada en la base de datos del
  estudio.

  '

tutorial:
  texto: "## Antes de empezar: ¿qué es el asistente?\n\n- Es un programa de **inteligencia artificial** que busca en leyes\
    \ mexicanas (códigos penales y leyes\n  generales) y responde citando los artículos que encontró.\n- Le escribes **como\
    \ le escribirías a una persona**, con tus propias palabras. No necesitas saber\n  términos legales.\n- Debajo de cada\
    \ respuesta puedes abrir **«Fuentes que consultó el asistente»** para ver los artículos\n  que usó.\n- Tarda unos segundos\
    \ en responder.\n- **Puede equivocarse.** En este estudio queremos saber justamente cómo lo usan las personas.\n\nHaz\
    \ una pregunta de práctica para ver cómo funciona. Esta práctica no cuenta para el estudio.\n"
  ejemplo: Si me encuentro una cartera tirada en la calle y me quedo con el dinero, ¿eso es delito?
  max_preguntas: 3
