<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de trámites</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1a1d24; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-ink:#ffffff; --soft:#f0f4ff; --warn:#b45309; --ok:#15803d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#12151c; --ink:#e8eaed; --muted:#9aa0ac;
           --line:#232833; --accent:#3b82f6; --accent-ink:#ffffff; --soft:#141a2b; --warn:#f59e0b; --ok:#22c55e; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .app{display:flex;height:100%}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:180px}
  button{font:inherit;cursor:pointer}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px}
  .primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:9px 14px;font-weight:600}
  .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:760px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .msg.user{align-self:flex-end;background:var(--soft)}
  .msg p:first-child{margin-top:0} .msg p:last-child{margin-bottom:0}
  .card{max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{font-size:16px;margin:0 0 6px} .card h3{font-size:14px;margin:12px 0 4px}
  .card ul{margin:4px 0;padding-left:20px}
  .aviso{border-left:3px solid var(--warn);padding:2px 0 2px 10px;margin:6px 0;font-size:14px}
  .muted{color:var(--muted)}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--warn);color:var(--warn)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btns button{background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:6px 14px}
  .btns button.go{background:var(--accent);color:var(--accent-ink)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
  td.v{font-weight:600} td.a{text-align:right;white-space:nowrap}
  .doc{max-width:820px;background:#fff;color:#111;border-radius:6px;padding:28px 36px;font:15px/1.6 Georgia,"Times New Roman",serif}
  .doc h2{font-size:15px;text-align:center;margin:18px 0 8px} .doc h3{font-size:15px;margin:14px 0 6px}
  .composer{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}
  .composer textarea{flex:1;resize:none;min-height:44px;max-height:160px;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}
  .q{font-weight:600}
  .help{font-size:13px;color:var(--muted);margin-top:4px}
  /* Panel de depuración */
  .debug{width:380px;flex:none;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:12px 14px;font-size:13px}
  .debug[hidden]{display:none}
  .debug h3{font-size:13px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .states{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .st{padding:3px 7px;border-radius:6px;border:1px solid var(--line);font:12px ui-monospace,Menlo,monospace}
  .st.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .arrow{color:var(--muted);font-size:11px}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;
    font:12px/1.45 ui-monospace,Menlo,monospace;margin:0;max-height:300px;overflow:auto}
  .chip{display:inline-block;font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:1px}
  @media (max-width: 900px){ .app{flex-direction:column} .debug{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45vh} }
  @media print{ body *{visibility:hidden} .doc, .doc *{visibility:visible} .doc{position:absolute;left:0;top:0;padding:0} }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="bar">
      <h1>📝 Asistente de trámites</h1>
      <button class="ghost" onclick="reiniciar()" title="Vuelve a elegir trámite (conserva lo que escribiste en el chat)">🔄 Empezar de nuevo</button>
      <button class="ghost" onclick="borrarDatos()" title="Borra de este navegador tu borrador y la conversación">🗑 Borrar mis datos</button>
      <button class="ghost" id="dbg-btn" onclick="toggleDebug()">🐞 Depuración</button>
      <a class="ghost" href="/" style="text-decoration:none">← Chat</a>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <textarea id="inp" placeholder="Escribe tu respuesta…" rows="1"></textarea>
      <button class="primary" id="send" onclick="enviar()">Enviar</button>
    </div>
  </div>
  <aside class="debug" id="debug" hidden></aside>
</div>
<script>
// Asistente de trámites — la máquina de estados vive en el servidor (forms/asistente.py); aquí solo
// se muestra la vista de cada estado. El BORRADOR (estado + respuestas) se guarda SOLO en este
// navegador (localStorage) y viaja al servidor en cada turno; el servidor no lo guarda.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = t => window.marked ? marked.parse(String(t || '')) : esc(t).replace(/\n/g, '<br>');
const KEY = 'tramite_v1';
let S = {borrador: null, mensajes: [], vista: null};
let busy = false;

function guardarLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function cargarLocal(){ try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return null; } }

async function turno(payload, textoUsuario){
  if(busy) return; busy = true; $('send').disabled = true;
  if(textoUsuario) S.mensajes.push({rol: 'user', texto: textoUsuario});
  render(true);
  try{
    const r = await fetch('/api/tramites/turno', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({borrador: S.borrador, ...payload})});
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
    S.borrador = d.borrador; S.vista = d.vista;
    registrar(d.vista);
  }catch(e){ S.mensajes.push({rol: 'bot', texto: '⚠️ ' + e.message}); }
  busy = false; $('send').disabled = false;
  guardarLocal(); render();
}

// Todo lo que dice el asistente queda en el historial: avisos, respuestas a dudas y cada pregunta.
// Una pregunta solo se vuelve a escribir si cambió de campo/estado o tras responder una duda.
function registrar(v){
  const t = (v.debug || {}).transicion;
  if(v.mensaje) S.mensajes.push({rol: 'bot', texto: v.mensaje});
  if(v.estado === 'TRIAJE' && t && t.a === 'TRIAJE')
    S.mensajes.push({rol: 'bot', texto: `📝 **${v.triaje.titulo}**\n\n${v.triaje.descripcion}`});
  const clave = v.estado + ':' + ((v.campo || {}).id || '');
  if(v.pregunta && (clave !== S.ultimaClave || v.repetir)){
    let txt = '**' + v.pregunta + '**';
    const c = v.campo || {};
    if(c.ayuda) txt += '\n\n_' + c.ayuda + '_';
    if(c.tipo === 'fecha') txt += '\n\n_Por ejemplo: 14 de febrero de 2012._';
    if(c.tipo === 'lista') txt += `\n\n_Puedes escribirlos todos juntos (${(c.subcampos || []).map(x => x.id).join(', ')} de cada uno)._`;
    S.mensajes.push({rol: 'bot', texto: txt});
  }
  S.ultimaClave = clave;
}

function enviar(texto){
  texto = (texto ?? $('inp').value).trim();
  if(!texto) return;
  $('inp').value = '';
  turno({mensaje: texto}, texto);
}
function evento(ev, campo, etiqueta){ turno({evento: ev, campo: campo || ''}, etiqueta); }
function reiniciar(){ evento('reiniciar', '', null); }
function borrarDatos(){
  if(!confirm('¿Borrar de este navegador tu borrador y la conversación?')) return;
  try{ localStorage.removeItem(KEY); sessionStorage.removeItem('tramite_contexto'); }catch(e){}
  S = {borrador: null, mensajes: [], vista: null}; turno({});
}
function toggleDebug(){
  const d = $('debug'); d.hidden = !d.hidden;
  try{ localStorage.setItem('tramite_debug', d.hidden ? '0' : '1'); }catch(e){}
}

// ── Vista del estado actual ─────────────────────────────────────────────────────
function render(cargando){
  const v = S.vista || {};
  let html = S.mensajes.map(m => `<div class="msg ${m.rol === 'user' ? 'user' : ''}">${m.rol === 'user' ? esc(m.texto) : md(m.texto)}</div>`).join('');
  if(cargando){ html += '<div class="msg muted">…</div>'; }
  else html += vistaEstado(v);
  $('msgs').innerHTML = html;
  $('msgs').scrollTop = $('msgs').scrollHeight;
  renderDebug(v.debug);
}

function botones(list){
  if(!list || !list.length) return '';
  return '<div class="btns">' + list.map(b => {
    const tag = b.borrador ? ' <span class="tag">borrador</span>' : '';
    if(b.enviar != null) return `<button onclick='enviar(${JSON.stringify(b.enviar)})'>${esc(b.texto)}</button>`;
    return `<button class="${b.evento === 'confirmar' || b.evento === 'aplica' ? 'go' : ''}" onclick='evento(${JSON.stringify(b.evento)}, "", ${JSON.stringify(b.texto)})'>${esc(b.texto)}${tag}</button>`;
  }).join('') + '</div>';
}

function vistaEstado(v){
  if(!v.estado) return '';
  if(v.estado === 'TRIAJE'){
    const t = v.triaje || {};
    return `<div class="card"><h2>${esc(t.titulo)}</h2><p>${esc(t.descripcion)}</p>
      <h3>Aplica si…</h3><ul>${(t.cuando_aplica || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3>No es para ti si…</h3><ul>${(t.cuando_no_aplica || []).map(x => `<li><b>${esc(x.si)}</b><br><span class="muted">${esc(x.sugerir)}</span></li>`).join('')}</ul>
      <h3>Antes de empezar</h3>${(t.avisos || []).map(a => `<div class="aviso">${esc(a)}</div>`).join('')}
      ${botones(v.botones)}</div>`;
  }
  if(v.estado === 'REVISION'){
    const fila = r => {
      let val = r.omitido ? '<span class="muted">(omitido)</span>' : r.valor;
      if(Array.isArray(val)) val = val.map(x => Object.values(x).filter(Boolean).join(', ')).join('<br>');
      else if(val === true) val = 'Sí'; else if(val === false) val = 'No'; else if(!r.omitido) val = esc(val ?? '');
      return `<tr><td>${esc(r.pregunta)}</td><td class="v">${val}</td>
        <td class="a"><button class="ghost" onclick='evento("corregir", ${JSON.stringify(r.id)}, ${JSON.stringify('Corregir: ' + r.pregunta)})'>✏️</button></td></tr>`;
    };
    return `<div class="card"><table>${(v.resumen || []).map(fila).join('')}</table>${botones(v.botones)}</div>`;
  }
  if(v.estado === 'DOCUMENTO'){
    return `<div class="card">
      ${(v.faltan || []).length ? `<div class="aviso">Faltan datos: ${v.faltan.map(esc).join(', ')}</div>` : ''}
      <div class="btns"><button class="go" onclick="descargarWord()">⬇️ Descargar Word</button>
        <button onclick="window.print()">🖨 Imprimir / PDF</button><button onclick="copiar()">📋 Copiar texto</button>
        ${botones(v.botones).replace('<div class="btns">', '').replace(/<\/div>$/, '')}</div></div>
      <div class="doc" id="doc">${md(v.documento)}</div>`;
  }
  // INICIO y ENTREVISTA: la pregunta ya está en el historial; aquí solo los botones de respuesta rápida.
  return botones(v.botones);
}

const ESTADOS = ['INICIO', 'TRIAJE', 'ENTREVISTA', 'REVISION', 'DOCUMENTO'];
function renderDebug(d){
  if(!d){ $('debug').innerHTML = '<p class="muted">Sin estado aún.</p>'; return; }
  const t = d.transicion;
  const llm = d.llm ? JSON.stringify(d.llm, null, 1) : '—';
  $('debug').innerHTML = `
    <h3>Estado</h3>
    <div class="states">${ESTADOS.map((s, i) => `<span class="st ${s === d.estado ? 'on' : ''}">${s}</span>${i < ESTADOS.length - 1 ? '<span class="arrow">→</span>' : ''}`).join('')}</div>
    <h3>Última transición</h3>
    <div>${t ? `<span class="chip">${esc(t.de)}</span> —<b>${esc(t.evento)}</b>→ <span class="chip">${esc(t.a)}</span><br><span class="muted">${esc(t.motivo)}</span>` : '<span class="muted">ninguna en este turno</span>'}</div>
    <h3>Formulario</h3><div>${esc(d.formulario || '—')} ${d.formulario_estado ? `<span class="tag">${esc(d.formulario_estado)}</span>` : ''}</div>
    <h3>Siguiente campo</h3><div>${d.siguiente_campo ? `<span class="chip">${esc(d.siguiente_campo)}</span>` : '—'} ${d.corrigiendo ? `(corrigiendo <span class="chip">${esc(d.corrigiendo)}</span>)` : ''}</div>
    <h3>Pendientes (${(d.pendientes || []).length})</h3><div>${(d.pendientes || []).map(p => `<span class="chip">${esc(p)}</span>`).join('') || '—'}</div>
    ${d.incompleto ? `<h3>Incompleto</h3><div><span class="chip">${esc(d.incompleto.campo)}</span> falta: ${esc(d.incompleto.faltan.join(', '))}</div>` : ''}
    <h3>Omitidos</h3><div>${(d.omitidos || []).map(p => `<span class="chip">${esc(p)}</span>`).join('') || '—'}</div>
    <h3>Respuestas</h3><pre>${esc(JSON.stringify(d.respuestas || {}, null, 1))}</pre>
    <h3>Gemma en este turno</h3><pre>${esc(llm)}</pre>
    ${d.rag ? `<h3>RAG (duda)</h3><pre>${esc(JSON.stringify(d.rag, null, 1))}</pre>` : ''}`;
}

// ── Documento: descargar / imprimir / copiar ────────────────────────────────────
function descargarWord(){
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8">
    <style>body{font-family:'Times New Roman';font-size:12pt;line-height:1.5} h2{font-size:12pt;text-align:center}</style></head>
    <body>${$('doc').innerHTML}</body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + html], {type: 'application/msword'}));
  a.download = 'borrador-tramite.doc'; a.click(); URL.revokeObjectURL(a.href);
}
function copiar(){ navigator.clipboard.writeText($('doc').innerText).then(() => alert('Texto copiado.')); }

$('inp').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } });

// ── Arranque ────────────────────────────────────────────────────────────────────
(function(){
  try{ if(localStorage.getItem('tramite_debug') === '1') $('debug').hidden = false; }catch(e){}
  const guardado = cargarLocal();
  // Viene del chat RAG con una sugerencia: lo que escribió allá se usa como contexto (nunca en la URL).
  let ctx = null, sugerido = null;
  try{ ctx = sessionStorage.getItem('tramite_contexto'); sugerido = new URLSearchParams(location.search).get('formulario');
       sessionStorage.removeItem('tramite_contexto'); }catch(e){}
  if(sugerido && (!guardado || !guardado.borrador || guardado.borrador.estado === 'INICIO')){
    S.borrador = {estado: 'INICIO', formulario: null, respuestas: {}, omitidos: [], corrigiendo: null, contexto: ctx || '', transicion: null};
    history.replaceState(null, '', location.pathname);
    turno({evento: 'elegir:' + sugerido});
    return;
  }
  if(guardado && guardado.borrador){ S = guardado; turno({}); }   // retoma donde se quedó
  else turno({});
})();
</script>
</body>
</html>
