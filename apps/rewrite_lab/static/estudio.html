<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio del asistente legal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1a1d24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --accent-ink:#fff;
         --soft:#f0f4ff; --warn:#b45309; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#12151c; --ink:#e8eaed; --muted:#9aa0ac; --line:#232833; --accent:#3b82f6; --soft:#141a2b;
           --warn:#f59e0b; --ok:#22c55e; --bad:#f87171; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .wrap.ancho{max-width:1280px}
  .dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
  .dos .chat{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  @media (max-width:900px){ .dos{grid-template-columns:1fr} .dos .chat{position:static;max-height:none} }
  header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:18px;margin:0;flex:1;min-width:200px}
  h2{font-size:17px;margin:0 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .muted{color:var(--muted)} .small{font-size:13px}
  button{font:inherit;cursor:pointer}
  .primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:9px 16px;font-weight:600}
  .primary:disabled{opacity:.5;cursor:default}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px}
  input[type=text],textarea,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--card);color:var(--ink);width:100%}
  textarea{resize:vertical;min-height:70px}
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent)}
  label.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
  .q{font-weight:600;margin:14px 0 4px}
  .msgs{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .msg{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);max-width:100%}
  .msg.user{align-self:flex-end;background:var(--soft);max-width:85%}
  .msg p:first-child{margin-top:0} .msg p:last-child{margin-bottom:0}
  details.src{font-size:13px;margin-top:8px} details.src summary{cursor:pointer;color:var(--muted)}
  .src .chunk{border-top:1px solid var(--line);padding:6px 0;white-space:pre-wrap}
  .composer{display:flex;gap:8px;align-items:flex-end}
  .likert{display:flex;gap:6px;flex-wrap:wrap}
  .likert label{border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
  .likert input{margin-right:4px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
  .step{border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  .step.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .step.done{border-color:var(--ok);color:var(--ok)}
  .err{color:var(--bad)}
  .aviso{border-left:3px solid var(--warn);padding:2px 0 2px 10px;font-size:14px}
  .thinking{color:var(--muted);font-style:italic}
  /* Consentimiento: ventana que hay que leer hasta el final para poder responder */
  .velo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .velo .caja{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;max-height:calc(100vh - 32px);
              display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .velo .cab{padding:14px 18px;border-bottom:1px solid var(--line)}
  .velo .cuerpo{padding:4px 18px 12px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
  .velo .cuerpo:focus{outline:none}
  .velo .pie{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .velo .pie .pista{flex-basis:100%;font-size:13px;color:var(--warn)}
  .velo .pie .pista.ok{color:var(--ok)}
  .velo .barra{height:4px;background:var(--line)} .velo .barra i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .velo .pie button{flex:1;min-width:200px}
  .velo .pie .ghost:disabled{opacity:.45;cursor:default}
  .velo .cuerpo a{color:var(--accent);text-decoration:underline}
  @media (prefers-color-scheme: dark){ .velo .cuerpo a{color:#93c5fd} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo">Estudio del asistente legal</h1>
    <button class="ghost" id="btnSalir" hidden title="Deja la computadora lista para la siguiente persona">Salir</button>
    <button class="ghost" id="btnRetirar" hidden>Retirarme del estudio</button>
  </header>
  <div id="app"></div>
</div>
<script>
const app = document.getElementById('app');
let codigo = '';
try { codigo = localStorage.getItem('estudio_codigo') || ''; } catch (e) {}
let E = null;          // estado del servidor
let intento = null;    // escenario en curso: {id, escenario}
let fase = 'chat';     // chat | preguntas

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => DOMPurify.sanitize(marked.parse(String(s || '')));

async function api(path, body) {
  const r = await fetch('/api/estudio/p/' + path, {method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Codigo': codigo}, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({error: 'Respuesta inválida del servidor.'}));
  if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
// Modo kiosco: computadora autorizada en /estudios; crea un código nuevo por persona (nadie lo escribe).
let kiosco = '';
try { kiosco = localStorage.getItem('estudio_kiosco') || ''; } catch (e) {}
// Enlace público (.../estudio#e=TOKEN): cada quien entra desde su casa. Funciona como el kiosco, pero el
// navegador es de UNA persona: no hay «siguiente participante» y si vuelve a abrir el enlace, continúa.
// El token va después de «#», así no viaja al servidor en la dirección ni queda en sus registros.
let enlace = false;
try {
  const m = location.hash.match(/[#&]e=([\w-]+)/);
  if (m) { localStorage.setItem('estudio_enlace', m[1]); history.replaceState(null, '', location.pathname); }
  if (!kiosco) { kiosco = localStorage.getItem('estudio_enlace') || ''; enlace = !!kiosco; }
} catch (e) {}
async function apiKiosco(path) {
  const r = await fetch('/api/estudio/k/' + path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Kiosco': kiosco}});
  const j = await r.json().catch(() => ({error: 'Respuesta inválida del servidor.'}));
  if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
function siguientePersona() {
  guardarCodigo(''); E = null; intento = null; fase = 'chat'; practica = [];
  window.scrollTo(0, 0);
  cargar();
}
// Deja la caja de texto lista para escribir (cursor al final), sin mover la página: así la persona
// sigue viendo la situación o la última respuesta.
function enfocar(el) {
  if (!el || el.disabled) return;
  el.focus({preventScroll: true});
  el.setSelectionRange(el.value.length, el.value.length);
}
// Respuesta en streaming: muestra el texto mientras el asistente lo escribe. Devuelve {respuesta, fuentes}.
async function preguntarStream(path, body, burbuja) {
  const r = await fetch('/api/estudio/p/' + path, {method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Codigo': codigo}, body: JSON.stringify(body)});
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ('Error ' + r.status)); }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '', texto = '', fuentes = [], pintar = false;
  const repintar = () => { pintar = false; burbuja.classList.remove('thinking'); burbuja.innerHTML = md(texto); };
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const linea = buf.slice(0, i); buf = buf.slice(i + 2);
      if (!linea.startsWith('data: ')) continue;
      const ev = JSON.parse(linea.slice(6));
      if (ev.stage === 'escribiendo' && !texto) burbuja.textContent = 'Escribiendo la respuesta…';
      else if (ev.stage === 'token') { texto += ev.text; if (!pintar) { pintar = true; requestAnimationFrame(repintar); } }
      else if (ev.stage === 'done') fuentes = ev.fuentes || [];
      else if (ev.stage === 'error') throw new Error(ev.error);
    }
  }
  if (!texto) throw new Error('El asistente no pudo responder. Intenta de nuevo en un momento.');
  return {respuesta: texto, fuentes};
}
// Orden de opciones al azar por persona y pregunta (estable al recargar); «No sé» siempre al final.
function barajar(opciones, semilla) {
  let h = 0; for (const ch of semilla) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) / 4294967296);
  // «otra» (no está mi respuesta) y «No sé» no se barajan: siempre al final, en ese orden.
  const FIJAS = ['otra', 'no_se'];
  const xs = Object.entries(opciones).filter(([k]) => !FIJAS.includes(k));
  for (let i = xs.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [xs[i], xs[j]] = [xs[j], xs[i]]; }
  return [...xs, ...FIJAS.filter(k => k in opciones).map(k => [k, opciones[k]])];
}
function guardarCodigo(c) { codigo = c; aceptoLeido = false; try { c ? localStorage.setItem('estudio_codigo', c) : localStorage.removeItem('estudio_codigo'); } catch (e) {} }

// ── Pantallas ────────────────────────────────────────────────────────────────
function pantallaCodigo(msg) {
  document.getElementById('btnRetirar').hidden = true;
  app.innerHTML = `<div class="card"><h2>Escribe tu código de participante</h2>
    <p class="muted small">Te lo dio la persona que organiza el estudio (por ejemplo ABCD-EF23).</p>
    <div class="composer"><input type="text" id="cod" autocomplete="off" placeholder="XXXX-XXXX" value="${esc(codigo)}">
    <button class="primary" id="go">Entrar</button></div>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
  const go = async () => { guardarCodigo(document.getElementById('cod').value.trim()); await cargar(); };
  document.getElementById('go').onclick = go;
  document.getElementById('cod').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function pantallaKiosco(msg) {
  document.getElementById('btnRetirar').hidden = true;
  document.getElementById('btnSalir').hidden = true;
  let titulo = 'Estudio del asistente legal', duracion = 'unos 15 minutos', n = 3, lleno = false;
  try { const k = await apiKiosco('estado'); titulo = k.titulo || titulo; duracion = k.duracion || duracion; n = k.situaciones || n; lleno = k.lleno; }
  catch (e) { msg = msg || e.message; }
  if (lleno) msg = 'Ya se completó el número de participantes de este enlace. ¡Gracias por tu interés!';
  document.getElementById('titulo').textContent = titulo;
  app.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px">
    <h2 style="font-size:22px">¡Hola! Gracias por participar</h2>
    <p>Vas a leer ${n} situaciones ficticias y a preguntarle a un asistente de inteligencia artificial con tus propias
    palabras. Toma ${esc(duracion)}. <b>No te pediremos tu nombre.</b></p>
    ${enlace ? '<p class="muted small">Hazlo de una sola vez, en un lugar tranquilo y de preferencia en computadora. Si cierras la página, puedes volver a abrir el enlace en este mismo navegador para continuar.</p>' : ''}
    <button class="primary" id="empezar" style="font-size:18px;padding:12px 28px;margin-top:8px" ${lleno ? 'disabled' : ''}>Empezar</button>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
  document.getElementById('empezar').onclick = async () => {
    try { guardarCodigo((await apiKiosco('nuevo')).codigo); await cargar(); }
    catch (e) { pantallaKiosco(e.message); }
  };
}

async function cargar() {
  if (!codigo) return kiosco ? pantallaKiosco() : pantallaCodigo();
  try { E = await api('estado'); } catch (e) { guardarCodigo(''); return kiosco ? pantallaKiosco(e.message) : pantallaCodigo(e.message); }
  document.getElementById('titulo').textContent = E.titulo || 'Estudio';
  document.getElementById('btnRetirar').hidden = false;
  document.getElementById('btnSalir').hidden = !kiosco || enlace;
  render();
}

function render() {
  document.querySelector('.wrap').classList.remove('ancho');
  if (!E.consentido) return pantallaConsentimiento();
  if (!E.tutorial_hecho) return pantallaTutorial();
  if (E.terminado) return pantallaGracias();
  const hechos = new Set((E.intentos || []).filter(i => i.fin).map(i => i.escenario));
  const pendiente = E.escenarios.find(s => !hechos.has(s.id));
  if (!pendiente) return pantallaCierre();
  pantallaEscenario(pendiente, hechos);
}

function pasos(actual, hechos) {
  const ps = E.escenarios.map((s, i) => `<span class="step ${s.id === actual ? 'on' : hechos.has(s.id) ? 'done' : ''}">Situación ${i + 1}</span>`);
  ps.push(`<span class="step ${actual === '_cierre' ? 'on' : ''}">Preguntas finales</span>`);
  return `<div class="steps">${ps.join('')}</div>`;
}

// Consentimiento informado: una ventana encima de la página. Los botones «Acepto» / «No acepto» se
// activan solo al llegar al final del texto. Después de aceptar, la persona contesta «Sobre ti» y al
// pulsar «Empezar» se registra el consentimiento (con la versión exacta del texto, en el servidor).
let aceptoLeido = false;
function pantallaConsentimiento() {
  if (!aceptoLeido) {
    app.innerHTML = `<div class="card"><h2>Consentimiento informado</h2>
      <p>Antes de empezar, lee la información del estudio. Para poder responder, desplázate hasta el final del texto.</p>
      <button class="primary" id="leer">Leer el consentimiento</button></div>`;
    document.getElementById('leer').onclick = ventanaConsentimiento;
    return ventanaConsentimiento();
  }
  const campoPerfil = p => {
    const tipo = p.tipo || 'opcion';
    const ayuda = p.ayuda ? `<div class="muted small">${esc(p.ayuda)}</div>` : '';
    let campo;
    if (tipo === 'texto') campo = `<input type="text" maxlength="120" data-perfil="${esc(p.id)}">`;
    else if (tipo === 'escala') campo = `<div class="likert">${[1,2,3,4,5].map(v =>
      `<label><input type="radio" name="perfil_${esc(p.id)}" value="${v}" data-escala="${esc(p.id)}">${v}</label>`).join('')}</div>`;
    else campo = `<select data-perfil="${esc(p.id)}"><option value="">— elige —</option>
      ${Object.entries(p.opciones).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join('')}</select>`;
    return `<div data-pq="${esc(p.id)}"><div class="q">${esc(p.pregunta)}</div>${ayuda}${campo}</div>`;
  };
  const perfil = (E.perfil || []).map(campoPerfil).join('');
  app.innerHTML = `<div class="card"><p class="small" style="margin:0">✅ Aceptaste participar.
      <a href="#" id="releer">Volver a leer el consentimiento</a></p></div>
    <div class="card"><h2>Sobre ti</h2><p class="muted small">Solo para comparar grupos. No pedimos tu nombre.</p>${perfil}
    <button class="primary" id="go" style="margin-top:14px">Empezar</button> <span id="msg" class="err"></span></div>`;
  document.getElementById('releer').onclick = e => { e.preventDefault(); ventanaConsentimiento(true); };
  // `mostrar_si`: una pregunta solo aparece si las anteriores tienen ciertos valores (p. ej. «área» solo con estudios universitarios).
  const valoresPerfil = () => {
    const vals = {};
    app.querySelectorAll('[data-pq]').forEach(d => {
      if (d.hidden) return;
      d.querySelectorAll('[data-perfil]').forEach(s => { if (s.value.trim()) vals[s.dataset.perfil] = s.value.trim(); });
      d.querySelectorAll('[data-escala]:checked').forEach(r => { vals[r.dataset.escala] = parseInt(r.value); });
    });
    return vals;
  };
  const actualizarVisibles = () => {
    for (const p of E.perfil || []) {
      const d = app.querySelector(`[data-pq="${CSS.escape(p.id)}"]`);
      const vals = valoresPerfil();
      d.hidden = !Object.entries(p.mostrar_si || {}).every(([k, vs]) => vs.includes(vals[k]));
    }
  };
  app.querySelectorAll('[data-pq] select').forEach(s => s.addEventListener('change', actualizarVisibles));
  actualizarVisibles();
  document.getElementById('go').onclick = async () => {
    const perfilVals = valoresPerfil();
    try { E = await api('consentir', {acepto: true, perfil: perfilVals}); render(); }
    catch (e) { document.getElementById('msg').textContent = e.message; }
  };
}

// soloLeer: ya aceptó y solo quiere releerlo (un botón «Cerrar» en vez de Acepto / No acepto).
function ventanaConsentimiento(soloLeer) {
  document.querySelector('.velo')?.remove();
  const v = document.createElement('div');
  v.className = 'velo';
  v.innerHTML = `<div class="caja" role="dialog" aria-modal="true" aria-labelledby="cTit">
      <div class="cab"><h2 id="cTit" style="margin:0">Consentimiento informado</h2></div>
      <div class="barra"><i id="cBarra"></i></div>
      <div class="cuerpo" id="cCuerpo" tabindex="0">${md(E.consentimiento)}</div>
      <div class="pie">${soloLeer ? '<button class="primary" id="cCerrar">Cerrar</button>' : `
        <span class="pista" id="cPista">↓ Desplázate hasta el final del texto para poder responder.</span>
        <button class="primary" id="cSi" disabled>Acepto participar en el estudio</button>
        <button class="ghost" id="cNo" disabled>No acepto participar</button>`}</div></div>`;
  document.body.appendChild(v);
  document.body.style.overflow = 'hidden';
  const cuerpo = v.querySelector('#cCuerpo'), cerrar = () => { v.remove(); document.body.style.overflow = ''; };
  cuerpo.focus({preventScroll: true});
  if (soloLeer) { v.querySelector('#cCerrar').onclick = cerrar; return; }
  const si = v.querySelector('#cSi'), no = v.querySelector('#cNo'), pista = v.querySelector('#cPista'), barra = v.querySelector('#cBarra');
  const revisar = () => {
    const falta = cuerpo.scrollHeight - cuerpo.clientHeight - cuerpo.scrollTop;
    const avance = cuerpo.scrollHeight <= cuerpo.clientHeight ? 1 : cuerpo.scrollTop / (cuerpo.scrollHeight - cuerpo.clientHeight);
    barra.style.width = Math.round(100 * Math.min(1, avance)) + '%';
    if (falta <= 8 && si.disabled) {   // llegó al final: ya puede responder (y se queda así aunque vuelva a subir)
      si.disabled = no.disabled = false;
      pista.textContent = 'Llegaste al final. Elige una opción.'; pista.classList.add('ok');
    }
  };
  cuerpo.addEventListener('scroll', revisar, {passive: true});
  window.addEventListener('resize', revisar);
  requestAnimationFrame(revisar);   // si el texto cabe sin desplazarse, se activan de inmediato
  si.onclick = () => { aceptoLeido = true; cerrar(); window.scrollTo(0, 0); render(); };
  no.onclick = () => { cerrar(); pantallaNoAcepto(); };
}

// No acepta: no se guarda nada de la persona (solo existía su código anónimo, sin datos).
function pantallaNoAcepto() {
  guardarCodigo(''); E = null;
  document.getElementById('btnRetirar').hidden = true;
  document.getElementById('btnSalir').hidden = true;
  app.innerHTML = `<div class="card"><h2>Gracias por tu tiempo</h2>
    <p>Elegiste no participar en el estudio. No se guardó ninguna respuesta tuya.</p>
    ${kiosco && !enlace ? '<button class="primary" id="sig">Dejar la computadora para la siguiente persona</button>' : '<p>Ya puedes cerrar esta página.</p>'}</div>`;
  if (kiosco && !enlace) document.getElementById('sig').onclick = siguientePersona;
}

let practica = [];   // preguntas de práctica de esta pantalla (no se guardan en el estudio)
function pantallaTutorial() {
  const T = E.tutorial || {};
  const quedan = Math.max(0, (T.max_preguntas ?? 2) - (E.practicas || 0) - practica.length);
  app.innerHTML = `<div class="steps"><span class="step on">Práctica</span>${E.escenarios.map((s, i) => `<span class="step">Situación ${i + 1}</span>`).join('')}<span class="step">Preguntas finales</span></div>
    <div class="card" style="margin-top:12px">${md(T.texto)}</div>
    <div class="card"><h2>Pruébalo</h2>
      <div class="msgs" id="msgs">${practica.map(t => `<div class="msg user">${esc(t.pregunta)}</div>${burbujaRespuesta(t)}`).join('')}</div>
      ${quedan ? `<div class="composer"><textarea id="txt">${practica.length ? '' : esc(T.ejemplo || '')}</textarea>
        <button class="primary" id="send">Enviar</button></div>
        <p class="muted small">${practica.length ? 'Puedes hacer una pregunta más de práctica, o empezar.' : 'Ya escribimos una pregunta de ejemplo: da clic en «Enviar» o pulsa Enter (o cámbiala por otra).'} Enter envía · Shift+Enter hace un salto de línea.</p>` : ''}
      <button class="primary" id="listo" style="margin-top:8px">Entendido, empezar el estudio →</button></div>`;
  const send = document.getElementById('send');
  if (send) send.onclick = async () => {
    const msg = document.getElementById('txt').value.trim();
    if (!msg || send.disabled) return;
    document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div class="msg user">${esc(msg)}</div><div class="msg thinking" id="pensando">Buscando en las leyes… (unos segundos)</div>`);
    send.disabled = true;
    try { const r = await preguntarStream('practica_stream', {mensaje: msg}, document.getElementById('pensando')); practica.push({pregunta: msg, respuesta: r.respuesta, fuentes: r.fuentes}); }
    catch (e) { practica.push({pregunta: msg, error: e.message}); }
    pantallaTutorial();
  };
  const txtP = document.getElementById('txt');
  enfocar(txtP);
  if (txtP) txtP.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.onclick(); } };
  document.getElementById('listo').onclick = async () => {
    try { E = await api('tutorial_listo'); practica = []; render(); window.scrollTo(0, 0); } catch (e) { alert(e.message); }
  };
}

function burbujaRespuesta(t) {
  const fuentes = t.fuentes || [];   // todas, también los artículos cercanos: lo mismo que leyó el asistente
  return `<div class="msg">${t.error ? '<span class="err">El asistente no pudo responder.</span>' : md(t.respuesta)}
    ${fuentes.length ? `<details class="src"><summary>Fuentes que consultó el asistente (${fuentes.length})</summary>
      ${fuentes.map(f => `<div class="chunk"><b>${esc(f.cita)}</b> — ${esc(f.jerarquia)}${f.vecino ? ' <i class="muted">(artículo cercano)</i>' : ''}\n${esc(f.texto)}</div>`).join('')}</details>` : ''}</div>`;
}

async function pantallaEscenario(s, hechos) {
  if (!intento || intento.escenario !== s.id) {
    const r = await api('iniciar', {escenario: s.id});
    intento = {...r.intento, turnos: r.turnos};
    fase = r.intento.preguntas_at ? 'preguntas' : 'chat';
  }
  const n = intento.turnos.length;
  app.innerHTML = `${pasos(s.id, hechos)}
    <div class="card" style="margin-top:12px"><h2>${esc(s.titulo)}</h2>${md(s.texto)}
      <p class="aviso">El asistente jurídico no puede ver esta situación: solo sabe lo que tú le escribas.</p>
      <p class="aviso">Pregúntale con tus propias palabras, como lo harías si te pasara a ti.</p>
    </div>
    <div id="zona"></div>`;
  const zona = document.getElementById('zona');
  if (fase === 'chat') {
    zona.innerHTML = `<div class="card"><div class="msgs" id="msgs">
        ${intento.turnos.map(t => `<div class="msg user">${esc(t.pregunta)}</div>${burbujaRespuesta(t)}`).join('')}</div>
      <div class="composer"><textarea id="txt" placeholder="Escribe tu pregunta al asistente…"></textarea>
        <button class="primary" id="send">Enviar</button></div>
      <p class="muted small">${n} de ${E.max_turnos} preguntas · Enter envía · Shift+Enter hace un salto de línea.</p>
      <button class="primary" id="listo" ${n ? '' : 'disabled'}>Ya entendí la situación → pasar a las preguntas</button>
      <p class="muted small">Después ya no podrás hacerle más preguntas al asistente en esta situación (pero sí releer la conversación).</p></div>`;
    const send = async () => {
      const txt = document.getElementById('txt'), msg = txt.value.trim();
      if (!msg || document.getElementById('send').disabled) return;
      const msgs = document.getElementById('msgs');
      msgs.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(msg)}</div><div class="msg thinking" id="pensando">Buscando en las leyes… (unos segundos)</div>`);
      txt.value = ''; document.getElementById('send').disabled = true;
      document.getElementById('listo').disabled = true;
      try {
        const r = await preguntarStream('preguntar_stream', {intento: intento.id, mensaje: msg}, document.getElementById('pensando'));
        intento.turnos.push({pregunta: msg, respuesta: r.respuesta, fuentes: r.fuentes});
      } catch (e) {
        intento.turnos.push({pregunta: msg, error: e.message});
      }
      pantallaEscenario(s, hechos);
    };
    document.getElementById('send').onclick = send;
    enfocar(document.getElementById('txt'));
    document.getElementById('txt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
    document.getElementById('listo').onclick = async () => {
      try { await api('a_preguntas', {intento: intento.id}); } catch (e) { alert(e.message); return; }
      fase = 'preguntas'; pantallaEscenario(s, hechos); window.scrollTo(0, 0);
    };
  } else {
    const opcion = (name, k, v) => `<label class="opt"><input type="radio" name="${esc(name)}" value="${esc(k)}"> <span>${esc(v)}</span></label>`;
    // Si elige «otra» (no está la respuesta que busca) aparece un cuadro para que escriba cuál cree que aplica.
    const preg = s.preguntas.map(p => `<div class="q">${esc(p.texto)}</div>
      ${barajar(p.opciones, codigo + s.id + p.id).map(([k, v]) => opcion('p_' + p.id, k, v)).join('')}
      ${'otra' in p.opciones ? `<input type="text" data-otra="${esc(p.id)}" maxlength="500" hidden placeholder="¿Cuál crees que aplica? Escríbelo como lo recuerdes.">` : ''}`).join('');
    // Solo en la ÚLTIMA situación de cada persona (así no influye en cómo pregunta en las demás).
    const esUltima = hechos.size === E.escenarios.length - 1;
    const extra = esUltima ? (E.ultima_situacion || []).map(q => `<div class="q">${esc(q.texto)}</div>
      ${Object.entries(q.opciones).map(([k, v]) => opcion('x_' + q.id, k, v)).join('')}`).join('') : '';
    const likert = [1,2,3,4,5].map(v => `<label><input type="radio" name="confianza" value="${v}">${v}</label>`).join('');
    document.querySelector('.wrap').classList.add('ancho');
    const chat = `<div class="card chat"><h2>Tu conversación con el asistente <span class="muted small">(solo lectura)</span></h2>
      <div class="msgs">${intento.turnos.map(t => `<div class="msg user">${esc(t.pregunta)}</div>${burbujaRespuesta(t)}`).join('')}</div></div>`;
    zona.innerHTML = `<div class="dos"><div><div class="card"><h2>Preguntas sobre la situación</h2>
      <p class="muted small">Contesta con lo que entendiste. Puedes releer tu conversación (a la derecha), pero ya no hacerle más preguntas al asistente.</p>${preg}
      ${extra}
      <div class="q">¿Qué tan seguro o segura estás de tus respuestas?</div>
      <div class="likert">${likert}</div><div class="muted small">1 = nada seguro · 5 = totalmente seguro</div>
      <div class="q">¿Notaste algún problema o error en las respuestas del asistente?</div>
      ${[['si','Sí'],['no','No'],['no_se','No estoy seguro/a']].map(([k,v]) => `<label class="opt"><input type="radio" name="detecto" value="${k}"> <span>${v}</span></label>`).join('')}
      <textarea id="detecto_cual" placeholder="Si notaste algo, ¿qué fue? (opcional)" style="margin-top:4px"></textarea>
      <div class="q">Si esto te pasara de verdad, ¿actuarías con base en lo que te dijo el asistente?</div>
      ${[['si','Sí'],['no','No'],['no_se','No sé']].map(([k,v]) => `<label class="opt"><input type="radio" name="actuaria" value="${k}"> <span>${v}</span></label>`).join('')}
      <div class="q">Comentarios adicionales <span class="muted small">(opcional)</span></div>
      <textarea id="comentario" placeholder="¿Algo más que quieras decirnos sobre esta situación o las respuestas del asistente?"></textarea>
      <p><button class="primary" id="fin">Terminar esta situación</button> <span id="msg" class="err"></span></p></div></div>${chat}</div>`;
    app.querySelectorAll('[data-otra]').forEach(inp => {
      app.querySelectorAll(`input[name="p_${inp.dataset.otra}"]`).forEach(r => r.onchange = () => {
        inp.hidden = !(r.checked && r.value === 'otra'); if (!inp.hidden) inp.focus();
      });
    });
    document.getElementById('fin').onclick = async () => {
      const val = name => (app.querySelector(`input[name="${name}"]:checked`) || {}).value;
      const respuestas = {};
      for (const p of s.preguntas) {
        const v = val('p_' + p.id);
        if (!v) return document.getElementById('msg').textContent = 'Contesta todas las preguntas.';
        respuestas[p.id] = v;
        if (v === 'otra') {
          const t = (app.querySelector(`[data-otra="${p.id}"]`) || {}).value || '';
          if (!t.trim()) return document.getElementById('msg').textContent = 'Escribe cuál crees que aplica.';
          respuestas[p.id + '__texto'] = t.trim();
        }
      }
      if (esUltima) for (const q of (E.ultima_situacion || [])) {
        const v = val('x_' + q.id);
        if (!v) return document.getElementById('msg').textContent = 'Contesta todas las preguntas.';
        respuestas['_' + q.id] = v;
      }
      const confianza = parseInt(val('confianza') || '0'), actuaria = val('actuaria'), detecto = val('detecto');
      if (!confianza || !actuaria || !detecto) return document.getElementById('msg').textContent = 'Contesta todas las preguntas.';
      const detecto_cual = document.getElementById('detecto_cual').value;
      const comentario = document.getElementById('comentario').value;
      try { E = await api('terminar', {intento: intento.id, respuestas, confianza, actuaria, detecto, detecto_cual, comentario}); intento = null; render(); window.scrollTo(0, 0); }
      catch (e) { document.getElementById('msg').textContent = e.message; }
    };
  }
}

function pantallaCierre() {
  const sus = (E.sus || []).map((t, i) => `<div class="q">${i + 1}. ${esc(t)}</div>
    <div class="likert">${[1,2,3,4,5].map(v => `<label><input type="radio" name="sus_${i}" value="${v}">${v}</label>`).join('')}</div>`).join('');
  const abiertas = (E.abiertas || []).map((t, i) => `<div class="q">${esc(t)}</div><textarea data-abierta="${i}"></textarea>`).join('');
  app.innerHTML = `${pasos('_cierre', new Set(E.escenarios.map(s => s.id)))}
    <div class="card" style="margin-top:12px"><h2>Preguntas finales</h2>
    ${sus ? `<p class="muted small">1 = totalmente en desacuerdo · 5 = totalmente de acuerdo</p>${sus}` : ''}${abiertas}
    <p><button class="primary" id="fin">Enviar y terminar</button> <span id="msg" class="err"></span></p></div>`;
  document.getElementById('fin').onclick = async () => {
    const susVals = (E.sus || []).map((_, i) => parseInt((app.querySelector(`input[name="sus_${i}"]:checked`) || {}).value || '0'));
    if (susVals.some(v => !v)) return document.getElementById('msg').textContent = 'Contesta las 10 afirmaciones.';
    const ab = {};
    app.querySelectorAll('[data-abierta]').forEach(t => { ab[(E.abiertas || [])[t.dataset.abierta]] = t.value; });
    try { E = await api('cierre', {sus: susVals, abiertas: ab}); render(); }
    catch (e) { document.getElementById('msg').textContent = e.message; }
  };
}

function pantallaGracias() {
  document.getElementById('btnSalir').hidden = true;
  app.innerHTML = `<div class="card"><h2>¡Gracias por participar!</h2>
    <p>Terminaste el estudio. Recuerda: el asistente puede equivocarse y no sustituye a una abogada o abogado.
    Si tienes un problema legal real, acude a la Defensoría Pública.</p>
    <p class="muted small">Tu código anónimo es <b>${esc(codigo)}</b>. Si después quieres retirar tus respuestas,
    anótalo y compártelo con quien organiza el estudio.</p>
    ${kiosco && !enlace ? '<button class="primary" id="sig">Listo — dejar la computadora para la siguiente persona</button>' : ''}
    ${enlace ? '<p>Ya puedes cerrar esta página.</p>' : ''}</div>`;
  if (kiosco && !enlace) document.getElementById('sig').onclick = siguientePersona;
}

document.getElementById('btnSalir').onclick = () => {
  if (!confirm('¿Salir? Lo que ya contestaste se guarda, pero ya no podrás continuar. La computadora queda lista para la siguiente persona.')) return;
  siguientePersona();
};

document.getElementById('btnRetirar').onclick = async () => {
  if (!confirm('¿Seguro que quieres retirarte? Se borrará todo lo que escribiste y tu código dejará de funcionar.')) return;
  try { await api('retirar'); } catch (e) { alert(e.message); return; }
  guardarCodigo(''); E = null; intento = null;
  app.innerHTML = `<div class="card"><h2>Te retiraste del estudio</h2><p>Se borró todo lo que escribiste. Gracias.</p>
    ${kiosco && !enlace ? '<button class="primary" id="sig">Dejar la computadora para la siguiente persona</button>' : ''}</div>`;
  document.getElementById('btnRetirar').hidden = true;
  document.getElementById('btnSalir').hidden = true;
  if (kiosco && !enlace) document.getElementById('sig').onclick = siguientePersona;
};

cargar();
</script>
</body>
