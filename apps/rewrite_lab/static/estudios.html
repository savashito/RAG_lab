<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudios con usuarios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1a1d24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --accent-ink:#fff;
         --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#12151c; --ink:#e8eaed; --muted:#9aa0ac; --line:#232833; --accent:#3b82f6; --ok:#22c55e; --bad:#f87171; --warn:#f59e0b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  h1{font-size:18px;margin:0 0 12px} h2{font-size:15px;margin:0 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .muted{color:var(--muted)}
  button,select,input{font:inherit}
  button{cursor:pointer}
  .primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 14px;font-weight:600}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px}
  select,input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink)}
  textarea{width:100%;min-height:420px;font:12.5px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
  table{border-collapse:collapse;width:100%} td,th{border-top:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
  th{font-weight:600;color:var(--muted);font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .err{color:var(--bad)} .ok{color:var(--ok)}
  .estado{padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
  .estado.abierto{border-color:var(--ok);color:var(--ok)} .estado.cerrado{border-color:var(--bad);color:var(--bad)}
  code{font:12px ui-monospace,Menlo,monospace}
  .scroll{overflow-x:auto}
  .small{font-size:12px}
  a.cod{cursor:pointer;color:var(--accent);text-decoration:underline}
  /* Vista de un participante */
  .panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;z-index:10}
  .panel[hidden]{display:none}
  .panel .hoja{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;padding:16px;border-left:1px solid var(--line)}
  .msg{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin:6px 0}
  .msg.user{background:color-mix(in srgb, var(--accent) 12%, var(--card))}
  .msg p:first-child{margin-top:0} .msg p:last-child{margin-bottom:0}
  .ok-b{color:var(--ok);font-weight:600} .mal-b{color:var(--bad);font-weight:600}
  details.src summary{cursor:pointer;color:var(--muted);font-size:12px}
  .chunk{border-top:1px solid var(--line);padding:4px 0;white-space:pre-wrap;font-size:12px}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px}
</style>
</head>
<body>
<div class="panel" id="panel" hidden><div class="hoja" id="hoja"></div></div>
<div class="wrap">
  <h1>🧪 Estudios con usuarios <a class="muted" href="/" style="font-size:13px;font-weight:400">← volver al app</a></h1>
  <div class="card"><div class="row"><select id="sel"></select> <span id="info" class="muted"></span></div>
    <p class="muted" style="margin:8px 0 0">Participantes entran en <code>/estudio</code> y calificadores en <code>/calificar</code>, con un código (sin cuenta de Google). El estudio debe estar <b>abierto</b>.</p></div>
  <div id="det"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.errores) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
let lista = [], actual = null;

async function cargarLista(sel) {
  lista = await api('GET', '/api/estudios');
  const s = document.getElementById('sel');
  s.innerHTML = lista.map(e => `<option value="${esc(e.id)}">${esc(e.titulo)} (${esc(e.id)})</option>`).join('');
  if (sel) s.value = sel;
  s.onchange = () => abrir(s.value);
  if (s.value) abrir(s.value);
}

async function abrir(id) {
  actual = await api('GET', '/api/estudios/' + encodeURIComponent(id));
  const e = lista.find(x => x.id === id) || {};
  document.getElementById('info').innerHTML = `<span class="estado ${esc(actual.estado)}">${esc(actual.estado)}</span>
    v${actual.version} · ${e.participantes || 0} participante(s) · ${e.turnos || 0} turno(s) · ${e.calificaciones || 0} calificación(es)`;
  document.getElementById('det').innerHTML = `
    <div class="card"><h2>Estado</h2><div class="row">
      ${['borrador', 'abierto', 'cerrado'].map(s => `<button class="ghost" data-estado="${s}" ${actual.estado === s ? 'disabled' : ''}>${s}</button>`).join('')}
      <span class="muted">Abierto = los códigos funcionan. Cerrado = ya nadie puede entrar.</span></div></div>
    <div class="card"><h2>Códigos de acceso</h2>
      <div class="row">Crear <input type="number" id="n" value="5" min="1" max="200" style="width:70px">
        <select id="tipo"><option value="participante">participante</option><option value="calificador">calificador</option></select>
        <select id="grupo"></select> <input id="nota" placeholder="nota (p. ej. salón 3B)" style="width:200px">
        <button class="primary" id="crear">Crear</button></div>
      <p class="muted">Reparte cada código a una sola persona. No anotes aquí nombres; si necesitas saber quién tiene qué código, guárdalo fuera del sistema.</p>
      <div class="scroll" id="codigos"></div></div>
    <div class="card"><h2>🖥 Modo kiosco (sesiones presenciales)</h2>
      <p class="muted">Convierte <b>esta computadora</b> en kiosco: <code>/estudio</code> mostrará un botón «Empezar» que crea
      un código anónimo nuevo para cada persona. Solo funciona mientras el estudio esté <b>abierto</b>. Después de activarlo
      puedes cerrar tu sesión.</p>
      <div class="row"><select id="kgrupo"><option value="general">general (se clasifica por su perfil)</option>
        <option value="lego">lego</option><option value="estudiante">estudiante</option><option value="experto">experto</option></select>
        <input id="knota" placeholder="nota (p. ej. sesión Facultad de Ciencias)" style="width:260px">
        <button class="primary" id="kact">Usar este equipo como kiosco</button>
        <button class="ghost" id="kquitar">Quitar modo kiosco de este equipo</button> <span id="kmsg"></span></div>
      <h2 style="margin-top:14px">🔗 Enlace público (para contestar desde casa)</h2>
      <p class="muted">Crea un enlace para compartir. Quien lo abra da clic en «Empezar» y recibe un código anónimo. Tiene un
      <b>cupo</b> máximo y se puede desactivar. Las personas quedan marcadas con su origen (enlace #N) para analizarlas aparte
      de las sesiones presenciales.</p>
      <div class="row">Cupo <input type="number" id="ecupo" value="60" min="1" max="1000" style="width:80px">
        <input id="enota" placeholder="nota (p. ej. grupo de WhatsApp Ciencias)" style="width:260px">
        <button class="primary" id="ecrear">Crear enlace público</button></div>
      <div class="scroll" id="kioscos" style="margin-top:8px"></div></div>
    <div class="card"><h2>Resultados</h2><div class="row"><button class="ghost" id="res">Calcular resumen</button>
      <a class="ghost" href="/api/estudios/${encodeURIComponent(id)}/export" style="text-decoration:none">⬇ Exportar JSON (seudónimo)</a></div>
      <div class="scroll" id="resumen"></div></div>
    <div class="card"><h2>Definición (estudio.yaml)</h2><textarea id="yaml" spellcheck="false">${esc(actual.spec_yaml)}</textarea>
      <div class="row"><button class="primary" id="guardar">Guardar</button> <span id="msg"></span></div></div>`;
  const grupos = {participante: ['general', 'lego', 'estudiante', 'experto'], calificador: ['estudiante', 'experto']};
  const setGrupos = () => { document.getElementById('grupo').innerHTML = grupos[document.getElementById('tipo').value].map(g => `<option>${g}</option>`).join(''); };
  document.getElementById('tipo').onchange = setGrupos; setGrupos();
  document.querySelectorAll('[data-estado]').forEach(b => b.onclick = async () => { await api('POST', `/api/estudios/${id}/estado`, {estado: b.dataset.estado}); cargarLista(id); });
  document.getElementById('crear').onclick = async () => {
    await api('POST', `/api/estudios/${id}/codigos`, {tipo: tipo.value, grupo: grupo.value, n: parseInt(n.value), nota: nota.value});
    codigos(id);
  };
  document.getElementById('guardar').onclick = async () => {
    const r = await api('PUT', '/api/estudios/' + id, {spec_yaml: yaml.value, version: actual.version});
    const m = document.getElementById('msg');
    if (r.errores && r.errores.length) { m.className = 'err'; m.innerHTML = r.errores.map(esc).join('<br>'); }
    else { m.className = 'ok'; m.textContent = 'Guardado.'; actual = r; cargarLista(id); }
  };
  document.getElementById('res').onclick = () => resumen(id);
  document.getElementById('kact').onclick = async () => {
    if (actual.estado !== 'abierto' && !confirm('El estudio no está abierto: el kiosco no funcionará hasta que lo abras. ¿Activarlo de todos modos?')) return;
    const r = await api('POST', `/api/estudios/${id}/kioscos`, {grupo: kgrupo.value, nota: knota.value});
    try { localStorage.setItem('estudio_kiosco', r.token); localStorage.removeItem('estudio_codigo'); } catch (e) {}
    location.href = '/estudio';
  };
  document.getElementById('ecrear').onclick = async () => {
    await api('POST', `/api/estudios/${id}/kioscos`, {tipo: 'enlace', grupo: 'general', cupo: parseInt(ecupo.value), nota: enota.value});
    kioscos(id);
  };
  document.getElementById('kquitar').onclick = () => {
    try { localStorage.removeItem('estudio_kiosco'); localStorage.removeItem('estudio_codigo'); } catch (e) {}
    document.getElementById('kmsg').textContent = 'Este equipo ya no es kiosco.';
  };
  kioscos(id);
  codigos(id);
}

async function codigos(id) {
  const cs = await api('GET', `/api/estudios/${id}/codigos`);
  document.getElementById('codigos').innerHTML = cs.length ? `<table><tr><th>Código</th><th>Tipo</th><th>Grupo</th><th>Nota</th><th>Avance</th><th>Activo</th></tr>
    ${cs.map(c => `<tr><td>${c.tipo === 'participante' && c.consentimiento_at ? `<a class="cod" data-ver="${esc(c.codigo)}"><code>${esc(c.codigo)}</code></a>` : `<code>${esc(c.codigo)}</code>`}</td><td>${esc(c.tipo)}</td><td>${esc(c.grupo)}</td><td>${esc(c.nota || '')}</td>
      <td>${c.tipo === 'participante' ? (c.terminado_at ? '✅ terminó' : c.consentimiento_at ? `${c.escenarios_terminados} escenario(s)` : '—') : `${c.calificadas} calificada(s)`}</td>
      <td><input type="checkbox" data-cod="${esc(c.codigo)}" ${c.activo ? 'checked' : ''}></td></tr>`).join('')}</table>` : '<p class="muted">Sin códigos todavía.</p>';
  document.querySelectorAll('[data-ver]').forEach(a => a.onclick = () => verParticipante(id, a.dataset.ver));
  document.querySelectorAll('[data-cod]').forEach(x => x.onchange = () => api('POST', `/api/estudios/${id}/codigos/${x.dataset.cod}/activo`, {activo: x.checked}));
}

async function kioscos(id) {
  const ks = await api('GET', `/api/estudios/${id}/kioscos`);
  const url = k => `${location.origin}/estudio#e=${k.token}`;
  document.getElementById('kioscos').innerHTML = ks.length ? `<table><tr><th>#</th><th>Tipo</th><th>Nota</th><th>Participantes</th><th>Enlace</th><th>Creado por</th><th>Activo</th></tr>
    ${ks.map(k => `<tr><td>${k.id}</td><td>${k.tipo === 'enlace' ? '🔗 enlace' : '🖥 kiosco'}</td><td>${esc(k.nota || '')}</td>
      <td>${k.participantes}${k.cupo ? ' / ' + k.cupo : ''}</td>
      <td>${k.tipo === 'enlace' ? `<code style="word-break:break-all">${esc(url(k))}</code> <button class="ghost" data-copiar="${esc(url(k))}">Copiar</button>` : '—'}</td>
      <td>${esc(k.creado_por || '')}</td>
      <td><input type="checkbox" data-kiosco="${k.id}" ${k.activo ? 'checked' : ''}></td></tr>`).join('')}</table>` : '';
  document.querySelectorAll('[data-kiosco]').forEach(x => x.onchange = () => api('POST', `/api/estudios/${id}/kioscos/${x.dataset.kiosco}/activo`, {activo: x.checked}));
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = 'Copiado ✓'; } catch (e) { prompt('Copia el enlace:', b.dataset.copiar); }
  });
}

const md = t => DOMPurify.sanitize(marked.parse(String(t || '')));
// Fechas de PostgreSQL («2026-10-09 18:19:08.56+00») → hora de la Ciudad de México.
const hora = t => {
  if (!t) return '—';
  const d = new Date(t.replace(' ', 'T').replace(/([+-]\d\d)$/, '$1:00'));
  return isNaN(d) ? t : d.toLocaleString('es-MX', {dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Mexico_City'});
};

async function verParticipante(eid, codigo) {
  const panel = document.getElementById('panel'), hoja = document.getElementById('hoja');
  panel.hidden = false;
  hoja.innerHTML = '<p class="muted">Cargando…</p>';
  let d;
  try { d = await api('GET', `/api/estudios/${eid}/participantes/${codigo}`); }
  catch (e) { hoja.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const etq = {}; (d.perfil_preguntas || []).forEach(p => etq[p.id] = p);
  const valor = (k, v) => (etq[k] && etq[k].opciones && etq[k].opciones[v]) || v;
  const perfil = Object.entries(d.perfil || {}).map(([k, v]) =>
    `<div class="muted">${esc((etq[k] || {}).pregunta || k)}</div><div>${esc(valor(k, v))}</div>`).join('');
  const sit = (d.intentos || []).map(it => {
    const sc = it.comprension || {};
    const preg = (it.preguntas || []).map(q => {
      const r = (it.respuestas || {})[q.id];
      const marca = r == null ? '<span class="muted">sin contestar</span>' : r === q.correcta ? '<span class="ok-b">✔</span>' : r === 'no_se' ? '<span class="muted">no sé</span>' : '<span class="mal-b">✘</span>';
      return `<div style="margin:6px 0"><b>${esc(q.texto)}</b><br>${marca} ${esc(q.opciones[r] || r || '')}
        ${r != null && r !== q.correcta ? `<div class="muted small">Correcta: ${esc(q.opciones[q.correcta] || q.correcta)}</div>` : ''}</div>`;
    }).join('');
    const turnos = (it.turnos || []).map(t => `<div class="msg user">${esc(t.pregunta)} <span class="muted" style="font-size:11px">${hora(t.ts)}${t.segundos ? ' · ' + t.segundos + ' s' : ''}</span>
        ${t.busqueda ? `<div class="muted" style="font-size:11px">búsqueda reescrita: ${esc(t.busqueda)}</div>` : ''}</div>
      <div class="msg">${t.error && !t.respuesta ? `<span class="err">${esc(t.error)}</span>` : md(t.respuesta)}
        <details class="src"><summary>Fuentes (${(t.contexto || []).length})</summary>${(t.contexto || []).map(f =>
          `<div class="chunk"><b>[${f.rank}] ${esc(f.cita)}</b> — ${esc((f.jerarquia || '').split(' > ').pop())}${f.vecino ? ' <i>(cercano)</i>' : ''}</div>`).join('')}</details></div>`).join('');
    return `<div class="card"><h2>${esc(it.titulo)}${it.variante ? ` <span class="muted">(${esc(it.variante)})</span>` : ''}</h2>
      <div class="muted small">${hora(it.inicio)} → ${it.fin ? hora(it.fin) : '<b>sin terminar</b>'}</div>
      <details style="margin:6px 0"><summary class="muted">Texto de la situación</summary>${md(it.texto)}</details>
      <h3 style="font-size:13px;margin:10px 0 4px">Conversación (${(it.turnos || []).length})</h3>${turnos || '<p class="muted">Sin preguntas.</p>'}
      ${it.fin ? `<h3 style="font-size:13px;margin:12px 0 4px">Respuestas — ${sc.aciertos ?? '?'} de ${sc.total ?? '?'} correctas</h3>${preg}
        <div class="kv" style="margin-top:6px"><div class="muted">Confianza</div><div>${it.confianza ?? '—'} / 5</div>
        <div class="muted">¿Notó un problema?</div><div>${esc(it.detecto || '—')}${it.detecto_cual ? ': ' + esc(it.detecto_cual) : ''}</div>
        <div class="muted">¿Actuaría?</div><div>${esc(it.actuaria || '—')}</div>
        <div class="muted">Comentarios</div><div>${esc(it.comentario || '—')}</div></div>` : ''}</div>`;
  }).join('');
  const cierre = d.cierre || {};
  hoja.innerHTML = `<div class="row" style="justify-content:space-between"><h1 style="margin:0">Participante <code>${esc(d.codigo)}</code></h1>
      <button class="ghost" id="cerrarPanel">Cerrar ✕</button></div>
    <p class="muted">${esc(d.grupo)} · ${esc(d.nota || '')} · empezó ${hora(d.consentimiento_at)} · ${d.terminado_at ? 'terminó ' + hora(d.terminado_at) : '<b>no terminó</b>'} · ${d.practicas} pregunta(s) de práctica</p>
    <div class="card"><h2>Perfil</h2><div class="kv">${perfil}</div></div>
    ${sit || '<p class="muted">Aún no empieza ninguna situación.</p>'}
    ${d.terminado_at ? `<div class="card"><h2>Cierre</h2><div class="kv"><div class="muted">SUS (respuestas 1–5)</div><div>${esc((cierre.sus || []).join(', '))}</div>
      ${Object.entries(cierre.abiertas || {}).map(([q, a]) => `<div class="muted">${esc(q)}</div><div>${esc(a || '—')}</div>`).join('')}</div></div>` : ''}`;
  document.getElementById('cerrarPanel').onclick = () => { panel.hidden = true; };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('panel').hidden = true; });
document.getElementById('panel').addEventListener('click', e => { if (e.target.id === 'panel') e.target.hidden = true; });

async function resumen(id) {
  const r = await api('GET', `/api/estudios/${id}/resumen`);
  const grupos = Object.keys(r).filter(k => !k.startsWith('_'));
  const filas = [['participantes', 'Participantes'], ['recall@10_primer_turno', 'Recall@10 del artículo (1er turno)'], ['n_turnos_con_gold', '  turnos medidos'],
    ['respuestas_correctas', 'Respuestas correctas (calificación final)'], ['respuestas_daninas', 'Respuestas engañosas o peligrosas'],
    ['daninas_por_jurisdiccion', '  … de ellas, por error de jurisdicción'], ['comprension', 'Comprensión (aciertos)'],
    ['comprension_con_confianza_alta', 'Comprensión cuando dijeron confianza 4–5'], ['n_confianza_alta', '  escenarios con confianza 4–5'], ['sus', 'SUS (0–100)']];
  const a = r._acuerdo || {};
  document.getElementById('resumen').innerHTML = grupos.length ? `<table><tr><th></th>${grupos.map(g => `<th>${esc(g)}</th>`).join('')}</tr>
    ${filas.map(([k, l]) => `<tr><td>${esc(l)}</td>${grupos.map(g => `<td>${r[g][k] ?? '—'}</td>`).join('')}</tr>`).join('')}</table>
    <p class="muted">Acuerdo entre estudiantes (κ de Cohen, veredicto): <b>${a.kappa_veredicto_estudiantes ?? '—'}</b> en ${a.pares || 0} par(es) ·
    ${a.a_experta || 0} respuesta(s) para desempate de la experta.</p>
    <h2 style="margin-top:14px">Por situación</h2><table><tr><th>Situación / variante</th><th>Escenarios terminados</th><th>Recall@10 (1er turno)</th><th>1ª pregunta dice el lugar</th><th>Recall@10 con / sin lugar</th><th>Comprensión</th><th>Notaron un problema</th></tr>
    ${Object.entries(r._por_escenario || {}).map(([k, m]) => `<tr><td>${esc(k)}</td><td>${m.intentos}</td><td>${m['recall@10_primer_turno'] ?? '—'}</td><td>${m.primera_pregunta_dice_lugar ?? '—'}</td><td>${m['recall@10_con_lugar'] ?? '—'} / ${m['recall@10_sin_lugar'] ?? '—'}</td><td>${m.comprension ?? '—'}</td><td>${m.detecto_problema ?? '—'}</td></tr>`).join('')}</table>` : '<p class="muted">Aún no hay datos.</p>';
}

cargarLista().catch(e => document.getElementById('det').innerHTML = `<p class="err">${esc(e.message)}</p>`);
</script>
</body>
</html>
