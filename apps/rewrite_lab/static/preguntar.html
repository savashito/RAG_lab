<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1a1d24; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-ink:#ffffff; --soft:#f0f4ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#12151c; --ink:#e8eaed; --muted:#9aa0ac;
           --line:#232833; --accent:#3b82f6; --accent-ink:#ffffff; --soft:#141a2b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 16px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
  h1{font-size:20px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:13px}
  form{display:flex;flex-direction:column;gap:10px}
  textarea{width:100%;min-height:88px;resize:vertical;padding:14px 16px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  .row{display:flex;justify-content:flex-end}
  button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
    padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:progress}
  #status{color:var(--muted);font-size:13px;min-height:18px;margin:16px 2px 0}
  #answer{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;white-space:normal;display:none}
  #answer.on{display:block}
  #answer p{margin:0 0 12px} #answer p:last-child{margin-bottom:0}
  #answer strong{font-weight:650}
  #answer h1,#answer h2,#answer h3,#answer h4{font-size:16px;margin:14px 0 6px;font-weight:650}
  #answer ul,#answer ol{margin:8px 0;padding-left:22px} #answer li{margin:3px 0}
  #answer code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em}
  #answer pre{background:var(--soft);padding:10px 12px;border-radius:8px;overflow:auto}
  #answer pre code{background:none;padding:0}
  #answer blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
  details.src{margin-top:18px}
  details.src>summary{cursor:pointer;user-select:none;color:var(--muted);font-size:14px;margin-bottom:6px}
  .frag{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:11px 14px;margin:8px 0}
  .frag h5{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--accent)}
  .frag .tag{font-weight:400;color:var(--muted)}
  .frag .passage{font-size:13.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;
    max-height:220px;overflow:auto}
  ol.refs{margin:8px 0 0;padding-left:22px;font-size:13.5px;line-height:1.5}
  ol.refs li{margin:5px 0;color:var(--ink)}
  .err{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;margin-top:12px}
  @media (prefers-color-scheme: dark){ .err{background:#2a1416;border-color:#4c1d1d;color:#fca5a5} }
  a{color:var(--accent)}
  /* Conmutador Preguntar | Conversar: mismo tema y parámetros (?tema=…) en ambas páginas. */
  .modes{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--card)}
  .modes a{padding:4px 10px;border-radius:7px;font-size:13px;line-height:1.4;color:var(--muted);text-decoration:none;white-space:nowrap}
  .modes a:hover{color:var(--ink)}
  .modes a[aria-current]{background:var(--soft);color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Consulta</h1>
    <nav class="modes" aria-label="Modo"><a href="/preguntar" data-path="/preguntar" aria-current="page">Preguntar</a><a href="/conversar" data-path="/conversar">Conversar</a></nav>
  </header>

  <form id="form">
    <textarea id="q" placeholder="Escribe tu pregunta…" autofocus></textarea>
    <div class="row"><button id="send" type="submit">Preguntar</button></div>
  </form>

  <div id="status"></div>
  <div id="answer"></div>
  <div id="extra"></div>
</div>

<script>
const P = new URLSearchParams(location.search);
const bool = (v, def) => v == null ? def : String(v).toLowerCase() !== 'false';
// Método de recuperación: acepta 'hibrido' sin acento y cae a 'orig' si no es válido.
const SETTINGS = ['orig', 'reescribir', 'multiquery', 'bm25', 'híbrido'];
let metodo = (P.get('metodo') || P.get('setting') || 'orig').toLowerCase();
if (metodo === 'hibrido') metodo = 'híbrido';
// k: entero acotado a [1, 20].
const k = Math.min(Math.max(parseInt(P.get('k'), 10) || 10, 1), 20);
// jurisdicción(es): coma-separadas, p. ej. ?jurisdiccion=federal,cdmx  (vacío = todas).
const jur = (P.get('jurisdiccion') || P.get('jurisdiction') || '')
  .split(',').map(s => s.trim()).filter(Boolean);
const CFG = {
  topic: P.get('tema') || 'psicologia_conductual',
  neighbors: bool(P.get('vecinos'), true),
  hyde: bool(P.get('HyDE') ?? P.get('hyde'), true),
  rerank: bool(P.get('rerank'), false),
  setting: SETTINGS.includes(metodo) ? metodo : 'orig',
  k, jurisdictions: jur,
};

const $ = id => document.getElementById(id);
// Enlace de login que regresa a esta misma página (con su ?tema=…) tras autenticarse.
const loginHref = () => '/login?next=' + encodeURIComponent(location.pathname + location.search);
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Formato mínimo: **negrita**, párrafos por línea en blanco, saltos simples.
function fmt(t){
  return t.split(/\n{2,}/).map(p =>
    '<p>' + esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>') + '</p>'
  ).join('');
}
// Markdown completo con marked (headings, listas, código…); fmt es respaldo si el CDN falla.
const md = t => window.marked ? marked.parse(String(t || '')) : fmt(t);
// El texto del chunk trae un prefijo "Fuente: …\nSección: …\n\n"; lo quitamos (ya va en el título).
function passage(t){
  return (t||'').replace(/^Fuente:[^\n]*\n(?:Secci[oó]n:[^\n]*\n)?\n?/, '').trim() || (t||'');
}

// Título bonito con el label del tópico (si se puede; requiere sesión).
fetch('/api/topics').then(r => r.ok ? r.json() : []).then(ts => {
  const t = (ts||[]).find(x => x.topic === CFG.topic);
  if (t && t.label){ $('title').textContent = t.label; document.title = t.label; }
}).catch(()=>{});

const form = $('form');
let busy = false;

form.addEventListener('submit', async e => {
  e.preventDefault();
  const question = $('q').value.trim();
  if (!question || busy) return;
  busy = true; $('send').disabled = true;
  $('extra').innerHTML = '';
  $('answer').className = ''; $('answer').innerHTML = '';
  $('status').textContent = '⏳ Buscando…';
  let answer = '';

  try{
    const resp = await fetch('/ask/stream', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        question, setting: CFG.setting, k: CFG.k, topic: CFG.topic,
        jurisdictions: CFG.jurisdictions,
        neighbors: CFG.neighbors, hyde: CFG.hyde, rerank: CFG.rerank,
      }),
    });
    if (resp.status === 401){
      $('status').textContent = '';
      $('extra').innerHTML = '<div class="err">Sesión expirada. <a href="' + loginHref() + '">Inicia sesión</a> para continuar.</div>';
      return;
    }
    if (!resp.ok || !resp.body){ throw new Error('HTTP ' + resp.status); }

    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true){
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const part of parts){
        const line = part.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(5).trim()); }catch{ continue; }
        if (ev.stage === 'retrieving'){ $('status').textContent = '⏳ Buscando en los documentos…'; }
        else if (ev.stage === 'context'){
          $('status').textContent = '✍️ Redactando respuesta…';
          const chunks = ev.chunks || [];
          if (chunks.length){
            // Referencias (APA) deduplicadas por documento
            const seen = new Set(), refs = [];
            for (const c of chunks){
              const key = c.source || '';
              if (key && !seen.has(key)){ seen.add(key); refs.push(c.citation || key.replace(/\.md$/, '')); }
            }
            const refList = '<ol class="refs">' + refs.map(r => '<li>' + esc(r) + '</li>').join('') + '</ol>';
            // Fragmentos con su texto
            const cards = chunks.map(c => {
              const src = c.doc_label || (c.source || '').replace(/\.md$/, '');
              const sec = c.hierarchy || c.title || '';
              let head = esc(src);
              if (sec) head += ' <span class="tag">· ' + esc(sec) + '</span>';
              if (c.neighbor) head += ' <span class="tag">· contexto vecino</span>';
              return '<div class="frag"><h5>' + head + '</h5>'
                   + '<div class="passage">' + esc(passage(c.text)) + '</div></div>';
            }).join('');
            $('extra').innerHTML =
              '<details class="src" open><summary>Referencias (' + refs.length + ')</summary>' + refList + '</details>'
            + '<details class="src"><summary>Fragmentos consultados (' + chunks.length + ')</summary>' + cards + '</details>';
          }
        }
        else if (ev.stage === 'token'){
          answer += ev.text || ''; $('answer').className = 'on'; $('answer').innerHTML = md(answer);
        }
        else if (ev.stage === 'done'){ $('status').textContent = ''; }
        else if (ev.stage === 'error'){ throw new Error(ev.error || 'error'); }
      }
    }
    if (!answer){ $('status').textContent = 'No se obtuvo respuesta.'; }
  }catch(err){
    $('status').textContent = '';
    $('extra').innerHTML = '<div class="err">Ocurrió un error: ' + esc(String(err.message||err)) + '</div>';
  }finally{
    busy = false; $('send').disabled = false;
  }
});

// Enter envía; Shift+Enter hace salto de línea.
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});

// Los enlaces del conmutador llevan la query ACTUAL (el tema puede haber cambiado).
document.querySelectorAll('.modes a').forEach(a => {
  const sync = () => { a.href = a.dataset.path + location.search; };
  sync(); a.addEventListener('pointerdown', sync); a.addEventListener('focus', sync); a.addEventListener('click', sync);
});
</script>
</body>
</html>
