<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversar</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1a1d24; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-ink:#ffffff; --soft:#f0f4ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#12151c; --ink:#e8eaed; --muted:#9aa0ac;
           --line:#232833; --accent:#3b82f6; --accent-ink:#ffffff; --soft:#141a2b; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .app{display:flex;height:100%}
  /* Sidebar */
  .side{width:250px;flex:none;border-right:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;min-height:0}
  .side .top{padding:12px;border-bottom:1px solid var(--line)}
  .newbtn{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;
    padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
  .convs{flex:1;overflow:auto;padding:6px}
  .conv{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .conv:hover{background:var(--soft)} .conv.active{background:var(--soft);font-weight:600}
  .conv .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .x{color:var(--muted);border:0;background:none;cursor:pointer;font-size:15px;opacity:0;padding:0 2px}
  .conv:hover .x{opacity:1}
  .empty{color:var(--muted);font-size:13px;padding:14px;text-align:center}
  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .bar .menu{display:none;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
  h1{font-size:17px;margin:0;font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
  .log .center{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .turn{max-width:88%;white-space:normal}
  .turn.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:9px 14px}
  .turn.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:13px 16px}
  .turn.bot p{margin:0 0 10px} .turn.bot p:last-child{margin-bottom:0} .turn.bot strong{font-weight:650}
  .turn.bot ul,.turn.bot ol{margin:6px 0;padding-left:20px}
  .srchq{color:var(--muted);font-size:12px;margin:2px 0 8px}
  details.src{margin-top:10px;font-size:13px}
  details.src>summary{cursor:pointer;color:var(--muted);user-select:none}
  ol.refs{margin:8px 0 0;padding-left:20px} ol.refs li{margin:4px 0}
  .frag{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:9px 12px;margin:7px 0}
  .frag h5{margin:0 0 5px;font-size:12.5px;font-weight:600;color:var(--accent)}
  .frag .tag{font-weight:400;color:var(--muted)}
  .frag .passage{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;max-height:200px;overflow:auto}
  .composer{border-top:1px solid var(--line);padding:12px 16px}
  .composer .center{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;min-height:46px;max-height:180px;resize:vertical;padding:11px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  button.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
    padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:progress}
  .muted{color:var(--muted)} .err{color:#dc2626} a{color:var(--accent)}
  @media (max-width:720px){
    .side{position:fixed;z-index:20;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
    .bar .menu{display:block}
    .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
    .backdrop.on{display:block}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="top"><button class="newbtn" id="new" type="button">＋ Nueva conversación</button></div>
    <div class="convs" id="convs"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <div class="bar">
      <button class="menu" id="menu" type="button" title="Conversaciones">☰</button>
      <h1 id="title">Conversar</h1>
    </div>
    <div class="log" id="log"><div class="center" id="logc"></div></div>
    <div class="composer">
      <div class="center">
        <form id="form" style="display:flex;gap:8px;align-items:flex-end;width:100%">
          <textarea id="q" placeholder="Escribe tu mensaje…" autofocus></textarea>
          <button class="send" id="send" type="submit">Enviar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
const P = new URLSearchParams(location.search);
const bool = (v, def) => v == null ? def : String(v).toLowerCase() !== 'false';
const SETTINGS = ['orig', 'reescribir', 'multiquery', 'bm25', 'híbrido'];
let metodo = (P.get('metodo') || P.get('setting') || 'orig').toLowerCase();
if (metodo === 'hibrido') metodo = 'híbrido';
const kParam = Math.min(Math.max(parseInt(P.get('k'), 10) || 5, 1), 20);
const jur = (P.get('jurisdiccion') || P.get('jurisdiction') || '').split(',').map(s => s.trim()).filter(Boolean);
const CFG = {
  topic: P.get('tema') || 'psicologia_conductual',
  neighbors: bool(P.get('vecinos'), true),
  hyde: bool(P.get('HyDE') ?? P.get('hyde'), true),
  rerank: bool(P.get('rerank'), false),
  setting: SETTINGS.includes(metodo) ? metodo : 'orig',
  k: kParam, jurisdictions: jur,
};

const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
function fmt(t){
  return (t || '').split(/\n{2,}/).map(b => {
    const lines = b.split('\n');
    if (lines.every(l => /^\s*[-*]\s+/.test(l)))
      return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>';
    return '<p>' + inline(b).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
function passage(t){ return (t || '').replace(/^Fuente:[^\n]*\n(?:Secci[oó]n:[^\n]*\n)?\n?/, '').trim() || (t || ''); }
function sourcesHTML(chunks, searchq){
  if (!chunks || !chunks.length) return '';
  const seen = new Set(), refs = [];
  for (const c of chunks){ const key = c.source || ''; if (key && !seen.has(key)){ seen.add(key); refs.push(c.citation || key.replace(/\.md$/, '')); } }
  const refList = '<ol class="refs">' + refs.map(r => '<li>' + esc(r) + '</li>').join('') + '</ol>';
  const cards = chunks.map(c => {
    const src = (c.source || '').replace(/\.md$/, ''), sec = c.hierarchy || c.title || '';
    let head = esc(src);
    if (sec) head += ' <span class="tag">· ' + esc(sec) + '</span>';
    if (c.neighbor) head += ' <span class="tag">· vecino</span>';
    return '<div class="frag"><h5>' + head + '</h5><div class="passage">' + esc(passage(c.text)) + '</div></div>';
  }).join('');
  return (searchq ? '<div class="srchq">🔎 búsqueda: ' + esc(searchq) + '</div>' : '')
    + '<details class="src" open><summary>Referencias (' + refs.length + ')</summary>' + refList + '</details>'
    + '<details class="src"><summary>Fragmentos (' + chunks.length + ')</summary>' + cards + '</details>';
}

// ── Persistencia (IndexedDB), scopeada por tema ────────────────────────────────
const DB_NAME = 'rag_conversar', DB_VER = 1;
let _db = null, curConv = null, busy = false;
function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    let rq; try { rq = indexedDB.open(DB_NAME, DB_VER); } catch(e){ return rej(e); }
    rq.onupgradeneeded = e => { const db = e.target.result;
      if (!db.objectStoreNames.contains('conversations')) db.createObjectStore('conversations', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('messages')){
        const s = db.createObjectStore('messages', { keyPath: 'mid', autoIncrement: true });
        s.createIndex('conv', 'convId', { unique: false });
      }
    };
    rq.onsuccess = e => { _db = e.target.result; res(_db); };
    rq.onerror = e => rej(e.target.error);
  });
}
const idbReq = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
async function dbAll(store){ const db = await openDB(); return idbReq(db.transaction(store, 'readonly').objectStore(store).getAll()); }
async function dbPut(store, val){ const db = await openDB(); return idbReq(db.transaction(store, 'readwrite').objectStore(store).put(val)); }
async function dbAdd(store, val){ const db = await openDB(); return idbReq(db.transaction(store, 'readwrite').objectStore(store).add(val)); }
async function dbDelete(store, key){ const db = await openDB();
  const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key);
  return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function msgsOf(convId){ const db = await openDB();
  const idx = db.transaction('messages', 'readonly').objectStore('messages').index('conv');
  return (await idbReq(idx.getAll(convId))).sort((a, b) => a.mid - b.mid); }
async function listConvs(){ // solo las del tema actual
  return (await dbAll('conversations')).filter(c => c.topic === CFG.topic).sort((a, b) => b.updated - a.updated); }

async function newConv(){
  const id = 'c' + Date.now() + Math.random().toString(36).slice(2, 6), now = Date.now();
  await dbPut('conversations', { id, title: 'Nueva conversación', topic: CFG.topic, created: now, updated: now });
  curConv = id; await renderSidebar(); await renderLog(); $('q').focus(); return id;
}
async function delConv(id, ev){
  if (ev) ev.stopPropagation();
  for (const m of await msgsOf(id)) await dbDelete('messages', m.mid);
  await dbDelete('conversations', id);
  if (curConv === id) curConv = null;
  const list = await listConvs();
  if (!curConv && list.length) curConv = list[0].id;
  await renderSidebar(); await renderLog();
}
async function selectConv(id){ curConv = id; closeSide(); await renderSidebar(); await renderLog(); $('q').focus(); }

async function renderSidebar(){
  const list = await listConvs();
  $('convs').innerHTML = list.length ? list.map(c =>
    `<div class="conv ${c.id === curConv ? 'active' : ''}" onclick="selectConv('${c.id}')">
       <span class="t">${esc(c.title || 'Conversación')}</span>
       <button class="x" onclick="delConv('${c.id}',event)" title="Borrar">✕</button>
     </div>`).join('') : '<div class="empty">Sin conversaciones aún.</div>';
}
async function renderLog(){
  const msgs = curConv ? await msgsOf(curConv) : [];
  $('logc').innerHTML = msgs.length ? msgs.map(m => m.role === 'user'
    ? '<div class="turn user">' + esc(m.content) + '</div>'
    : '<div class="turn bot">' + fmt(m.content) + sourcesHTML(m.chunks, m.search_query) + '</div>'
  ).join('') : '<div class="empty">Escribe tu primera pregunta abajo.</div>';
  const l = $('log'); l.scrollTop = l.scrollHeight;
}

// Título con el label del tópico.
fetch('/api/topics').then(r => r.ok ? r.json() : []).then(ts => {
  const t = (ts || []).find(x => x.topic === CFG.topic);
  if (t && t.label){ $('title').textContent = t.label; document.title = t.label; }
}).catch(() => {});

async function readSSE(resp, onEvent){
  const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
  for(;;){
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0){
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = raw.split('\n').find(l => l.startsWith('data:'));
      if (line){ try { onEvent(JSON.parse(line.slice(5).trim())); } catch(e){} }
    }
  }
}

const form = $('form');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('q').value.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true; $('q').value = '';
  if (!curConv) await newConv();
  await dbAdd('messages', { convId: curConv, role: 'user', content: text, ts: Date.now() });
  // Titula la conversación con la primera pregunta.
  const conv = (await listConvs()).find(c => c.id === curConv);
  const userCount = (await msgsOf(curConv)).filter(m => m.role === 'user').length;
  if (conv && userCount <= 1){ conv.title = text.slice(0, 60); conv.updated = Date.now(); await dbPut('conversations', conv); }
  await renderSidebar(); await renderLog();

  // Burbuja en vivo
  const live = document.createElement('div'); live.className = 'turn bot';
  live.innerHTML = '<span class="muted">⏳ …</span>'; $('logc').appendChild(live);
  const toBottom = () => { const l = $('log'); l.scrollTop = l.scrollHeight; }; toBottom();

  let answer = '', errMsg = null, meta = { chunks: [], search_query: '' };
  try{
    const history = (await msgsOf(curConv)).map(m => ({ role: m.role, content: m.content }));
    const resp = await fetch('/chat/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history, setting: CFG.setting, k: CFG.k, topic: CFG.topic,
        jurisdictions: CFG.jurisdictions, neighbors: CFG.neighbors, hyde: CFG.hyde, rerank: CFG.rerank,
      }),
    });
    if (resp.status === 401) throw new Error('Sesión expirada. <a href="/login">Inicia sesión</a>.');
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    await readSSE(resp, ev => {
      if (ev.stage === 'search'){ if (!answer) live.innerHTML = '<span class="muted">🔎 buscando: ' + esc(ev.query || '') + '</span>'; }
      else if (ev.stage === 'retrieving'){ if (!answer) live.innerHTML = '<span class="muted">⏳ recuperando…</span>'; }
      else if (ev.stage === 'context'){ meta.chunks = ev.chunks || []; meta.search_query = ev.search_query || '';
        if (!answer) live.innerHTML = '<span class="muted">✍️ redactando…</span>'; }
      else if (ev.stage === 'token'){ answer += ev.text || ''; live.innerHTML = fmt(answer); toBottom(); }
      else if (ev.stage === 'error'){ errMsg = ev.error || 'error'; }
    });
    if (errMsg) throw new Error(errMsg);
    await dbAdd('messages', { convId: curConv, role: 'assistant', content: answer || '(sin respuesta)', ts: Date.now(),
      chunks: meta.chunks, search_query: meta.search_query });
    const c2 = (await listConvs()).find(c => c.id === curConv);
    if (c2){ c2.updated = Date.now(); await dbPut('conversations', c2); }
  }catch(err){
    await dbAdd('messages', { convId: curConv, role: 'assistant', content: '⚠️ ' + (err.message || err), ts: Date.now() });
  }finally{
    live.remove();
    busy = false; $('send').disabled = false;
    await renderSidebar(); await renderLog(); $('q').focus();
  }
});

$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
$('new').addEventListener('click', () => newConv());

// Drawer móvil
const openSide = () => { $('side').classList.add('open'); $('backdrop').classList.add('on'); };
const closeSide = () => { $('side').classList.remove('open'); $('backdrop').classList.remove('on'); };
$('menu').addEventListener('click', openSide);
$('backdrop').addEventListener('click', closeSide);

// Init: carga conversaciones del tema; selecciona la más reciente o deja vacío.
(async () => {
  try{
    await openDB();
    const list = await listConvs();
    curConv = list.length ? list[0].id : null;
    await renderSidebar(); await renderLog();
  }catch(e){
    $('logc').innerHTML = '<div class="empty err">Tu navegador no permite IndexedDB; no se puede guardar el historial.</div>';
  }
})();
</script>
</body>
</html>
