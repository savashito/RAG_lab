# ===========================================================================
# legis.tlacua.cloud  —  NO es un archivo aparte.
# Se AGREGA al archivo existente:  /etc/nginx/sites-available/tlacua.cloud
#
# PASO A) En el primer server{} (el redirect 80->443), agrega dentro:
#     if ($host = legis.tlacua.cloud) { return 301 https://$host$request_uri; }
#   y añade  legis.tlacua.cloud  al final de la linea  server_name tlacua.cloud www... ;
#
# PASO B) Pega este server{} nuevo (copiado del de dengue, proxy a :8060):
# ===========================================================================
server {
    listen 443 ssl;
    server_name legis.tlacua.cloud;
    ssl_certificate     /etc/letsencrypt/live/tlacua.cloud/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tlacua.cloud/privkey.pem;     # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP laxo: la UI usa cdnjs (chart.js, marked) y <script> inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://accounts.google.com" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location ~ /\. { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
